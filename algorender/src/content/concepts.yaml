# The concept graph. Every concept belongs to a track, lists its prerequisites,
# and points at the visualisers (and lesson, if written) that teach it.
# Validated by src/content/concepts.ts and src/content/content.test.ts:
# ids exist, prerequisites form no cycle, every visualiser on the site is
# taught by at least one concept, and planned concepts have nothing to open yet.
#
# Each track belongs to one area (dsa, math, ml, systems or languages): what the placement
# check offers, what next steps spread across, and the track's colour family
# (src/data/tracks.ts, which content.test.ts keeps in step with this file).
#
# The math and ML concepts marked `planned` are the zero-to-hero path, built in
# batches B1–B17. An available concept can't depend on a planned one, so some
# prerequisites wait for their batch: those are noted on the concept as
# "# Bn: + id".

tracks:
  - id: foundations
    title: Foundations
    area: dsa
    summary: How to measure an algorithm, and the recursive thinking most of the rest builds on.
  - id: linear
    title: Arrays and lists
    area: dsa
    summary: Sequences in memory, and the structures built from them.
  - id: searching-sorting
    title: Searching and sorting
    area: dsa
    summary: Finding things fast, and putting things in order.
  - id: hashing
    title: Hashing
    area: dsa
    summary: Turning keys into positions for constant-time lookups.
  - id: trees
    title: Trees and heaps
    area: dsa
    summary: Hierarchies that keep data ordered or prioritised.
  - id: patterns
    title: Problem-solving patterns
    area: dsa
    summary: Techniques that turn up again and again in interview problems.
  - id: graphs
    title: Graphs
    area: dsa
    summary: Networks of things and the connections between them.
  - id: design
    title: Algorithm design
    area: dsa
    summary: Greedy choices, dynamic programming and backtracking.
  - id: strings
    title: Strings
    area: dsa
    summary: Searching text without starting over at every mismatch.
  - id: math-toolkit
    title: The math toolkit
    area: math
    summary: Functions, logarithms, sums and angles, the school math everything after it reads, and how computers store numbers.
  - id: linear-algebra
    title: Linear algebra
    area: math
    summary: Vectors, matrices and the decompositions behind data and models.
  - id: calculus
    title: Calculus and optimisation
    area: math
    summary: Slopes, gradients and curvature, and how models find their way downhill.
  - id: probability
    title: Probability and statistics
    area: math
    summary: Chance, distributions and evidence, and how sure a measurement lets you be.
  - id: ml
    title: Classical machine learning
    area: ml
    summary: From fitting a line to forests, kernels and clustering, built step by step.
  - id: deep-learning
    title: Deep learning
    area: ml
    summary: Training deep networks, convolutions and residuals, generative models, and networks on graphs.
  - id: llms
    title: Language models
    area: ml
    summary: Tokens, attention and a GPT built from scratch, then fine-tuning and honest evaluation.
  - id: interpretability
    title: Interpretability
    area: ml
    summary: Looking inside a trained transformer for the features and circuits it learned.
    planned: true
  - id: systems
    title: Systems
    area: systems
    summary: How operating systems, databases and distributed systems really work.
  - id: python
    title: Python
    area: languages
    summary: Programming from zero in Python, watching every name, list and call in memory as it runs.

concepts:
  # ── Foundations ──────────────────────────────────────────────
  - id: big-o
    title: Big-O and growth
    track: foundations
    summary: Counting how the work an algorithm does grows as its input grows.
    links: [{ href: /compare, label: Race the sorts and chart their growth }]
    lesson: big-o
  - id: recursion
    title: Recursion and the call tree
    track: foundations
    summary: Solving a problem by solving smaller copies of it, and picturing the calls as a tree.
    prereqs: [big-o]
    visualisers: [fibonacci-memoization, subsets]
    lesson: recursion

  # ── Arrays and lists ─────────────────────────────────────────
  - id: arrays
    title: Arrays
    track: linear
    summary: Contiguous cells with constant-time indexing, and the cost of growing and shifting.
    prereqs: [big-o]
    visualisers: [array]
    lesson: arrays
  - id: stacks-queues
    title: Stacks and queues
    track: linear
    summary: Last in first out, and first in first out, on top of arrays and rings.
    prereqs: [arrays]
    visualisers: [stack, queue, deque]
    lesson: stacks-queues
  - id: linked-lists
    title: Linked lists
    track: linear
    summary: Nodes joined by pointers, so inserting is cheap but finding is not.
    prereqs: [arrays]
    visualisers: [linked-list]
    lesson: linked-lists

  # ── Searching and sorting ────────────────────────────────────
  - id: linear-search
    title: Linear search
    track: searching-sorting
    summary: Checking every element in turn, the baseline everything else is measured against.
    prereqs: [arrays]
    visualisers: [linear-search]
    lesson: linear-search
  - id: binary-search
    title: Binary search
    track: searching-sorting
    summary: Halving a sorted search space with every comparison.
    prereqs: [linear-search]
    visualisers: [binary-search, jump-search, exponential-search, interpolation-search, fibonacci-search]
    lesson: binary-search
  - id: quadratic-sorts
    title: Simple sorts
    track: searching-sorting
    summary: Bubble, selection and insertion sort, and why they cost O(n²).
    prereqs: [arrays]
    visualisers: [bubble-sort, selection-sort, insertion-sort]
    links: [{ href: /compare, label: Race them }]
    lesson: sorting-in-code
  - id: merge-sort
    title: Merge sort
    track: searching-sorting
    summary: Divide in half, sort each half, merge, for a guaranteed O(n log n).
    prereqs: [quadratic-sorts, recursion]
    visualisers: [merge-sort]
    lesson: merge-sort
  - id: quick-sort
    title: Quick sort
    track: searching-sorting
    summary: Partition around a pivot, then sort each side; fast on average, fragile on bad pivots.
    prereqs: [quadratic-sorts, recursion]
    visualisers: [quick-sort]
    lesson: quick-sort
  - id: heap-sort
    title: Heap sort
    track: searching-sorting
    summary: Build a max-heap in place, then repeatedly move the maximum to the end.
    prereqs: [heaps]
    visualisers: [heap-sort]
    lesson: heap-sort
  - id: non-comparison-sorts
    title: Sorting without comparisons
    track: searching-sorting
    summary: Counting and radix sort beat the n log n limit by never comparing two elements.
    prereqs: [quadratic-sorts]
    visualisers: [counting-sort, radix-sort]
    lesson: non-comparison-sorts

  # ── Hashing ──────────────────────────────────────────────────
  - id: hash-tables
    title: Hash tables
    track: hashing
    summary: Hash a key to a bucket, chain collisions, and resize before chains grow long.
    prereqs: [arrays, linked-lists]
    visualisers: [hash-table, hash-set]
    lesson: hash-tables
  - id: bloom-filters
    title: Bloom filters
    track: hashing
    summary: A few bits per item that answer "definitely not" or "probably yes".
    prereqs: [hash-tables]
    visualisers: [bloom-filter]
    lesson: bloom-filters

  # ── Trees and heaps ──────────────────────────────────────────
  - id: binary-search-trees
    title: Binary search trees
    track: trees
    summary: Smaller keys to the left, larger to the right, so search follows one path.
    prereqs: [binary-search, recursion]
    visualisers: [binary-tree]
    lesson: binary-search-trees
  - id: balanced-trees
    title: Self-balancing trees
    track: trees
    summary: AVL rotations keep a search tree's height near log n whatever the insert order.
    prereqs: [binary-search-trees]
    visualisers: [avl-tree]
    lesson: balanced-trees
  - id: b-trees
    title: B-trees
    track: trees
    summary: Wide nodes with many keys, the shape behind database indexes.
    prereqs: [balanced-trees]
    visualisers: [b-tree]
    lesson: b-trees
  - id: heaps
    title: Heaps and priority queues
    track: trees
    summary: A tree packed into an array that always has its smallest (or largest) item on top.
    prereqs: [arrays]
    visualisers: [heap]
    lesson: heaps
  - id: tries
    title: Tries
    track: trees
    summary: One letter per edge, so every path from the root spells a prefix.
    prereqs: [linked-lists]
    visualisers: [trie]
    lesson: tries
  - id: union-find
    title: Union-find
    track: trees
    summary: Disjoint sets as a forest, with path compression for near-constant time.
    prereqs: [arrays, recursion]
    visualisers: [union-find]
    lesson: union-find

  # ── Patterns ─────────────────────────────────────────────────
  - id: two-pointers
    title: Two pointers
    track: patterns
    summary: Move two indices toward each other to rule out a value at every step.
    prereqs: [arrays, big-o]
    visualisers: [two-pointers]
    lesson: two-pointers
  - id: sliding-window
    title: Sliding window
    track: patterns
    summary: Keep one running total and slide it, instead of re-adding every window.
    prereqs: [two-pointers]
    visualisers: [sliding-window]
    lesson: sliding-window
  - id: monotonic-stack
    title: Monotonic stack
    track: patterns
    summary: A stack kept in order, so each element is pushed and popped once.
    prereqs: [stacks-queues]
    visualisers: [monotonic-stack]
    lesson: monotonic-stack
  - id: intervals
    title: Intervals
    track: patterns
    summary: Sort by start, then sweep, to merge overlaps or count rooms.
    prereqs: [merge-sort, heaps]
    visualisers: [merge-intervals, meeting-rooms]
    lesson: intervals

  # ── Graphs ───────────────────────────────────────────────────
  - id: graph-representations
    title: Representing graphs
    track: graphs
    summary: Adjacency lists versus adjacency matrices, and what each costs.
    prereqs: [arrays, linked-lists]
    visualisers: [graph, adjacency-list, adjacency-matrix]
    lesson: graph-representations
  - id: bfs-dfs
    title: Breadth-first and depth-first search
    track: graphs
    summary: Exploring a graph with a queue or a stack, level by level or path by path.
    prereqs: [graph-representations, stacks-queues]
    visualisers: [breadth-first-search, depth-first-search]
    lesson: bfs-dfs
  - id: topological-sort
    title: Topological sort
    track: graphs
    summary: Ordering tasks so every dependency comes first, or proving there is a cycle.
    prereqs: [bfs-dfs]
    visualisers: [topological-sort]
    lesson: topological-sort
  - id: shortest-paths
    title: Shortest paths
    track: graphs
    summary: Dijkstra's greedy settling, and Bellman–Ford for negative edges.
    prereqs: [bfs-dfs, heaps]
    visualisers: [dijkstra, bellman-ford]
    lesson: dijkstra
  - id: all-pairs-shortest-paths
    title: All-pairs shortest paths
    track: graphs
    summary: Floyd–Warshall tries every node as a stepping stone between every pair.
    prereqs: [shortest-paths, dynamic-programming]
    visualisers: [floyd-warshall]
    lesson: all-pairs-shortest-paths
  - id: minimum-spanning-trees
    title: Minimum spanning trees
    track: graphs
    summary: Connecting every node at least cost, growing a tree (Prim) or merging forests (Kruskal).
    prereqs: [bfs-dfs, heaps, union-find]
    visualisers: [prims, kruskals]
    lesson: minimum-spanning-trees
  - id: strongly-connected-components
    title: Strongly connected components
    track: graphs
    summary: Groups of nodes that can all reach each other, found with one or two depth-first passes.
    prereqs: [bfs-dfs]
    visualisers: [kosaraju, tarjan]
    lesson: strongly-connected-components

  # ── Algorithm design ─────────────────────────────────────────
  - id: greedy
    title: Greedy algorithms
    track: design
    summary: Taking the best-looking choice each time, and knowing when that is safe.
    prereqs: [quadratic-sorts]
    visualisers: [activity-selection, knapsack-greedy]
    lesson: greedy
  - id: memoization
    title: Memoization
    track: design
    summary: Remembering answers to repeated subproblems turns exponential recursion into linear work.
    prereqs: [recursion]
    visualisers: [fibonacci-memoization]
    lesson: memoization
  - id: dynamic-programming
    title: Dynamic programming
    track: design
    summary: Filling a table of subproblem answers in an order where each cell's inputs are ready.
    prereqs: [memoization]
    visualisers: [coin-change, house-robber, unique-paths, knapsack-01]
    lesson: dynamic-programming
  - id: sequence-dp
    title: Dynamic programming on sequences
    track: design
    summary: Comparing two strings, or one sequence with itself, cell by cell.
    prereqs: [dynamic-programming]
    visualisers: [longest-common-subsequence, edit-distance, longest-increasing-subsequence]
    lesson: sequence-dp
  - id: backtracking
    title: Backtracking
    track: design
    summary: Build a solution one choice at a time and undo choices that lead nowhere.
    prereqs: [recursion]
    visualisers: [subsets, permutations, n-queens, sudoku-solver]
    lesson: backtracking

  # ── Strings ──────────────────────────────────────────────────
  - id: string-matching
    title: String matching
    track: strings
    summary: Finding a pattern in text without restarting from scratch after each mismatch.
    prereqs: [arrays, hash-tables]
    visualisers: [kmp, rabin-karp, z-algorithm]
    lesson: string-matching
  - id: palindromes
    title: Palindromes
    track: strings
    summary: Manacher's algorithm reuses mirror images to find every palindrome in linear time.
    prereqs: [string-matching]
    visualisers: [manacher]
    lesson: palindromes

  # ── The math toolkit ─────────────────────────────────────────
  - id: functions-graphs
    title: Functions and their graphs
    track: math-toolkit
    summary: A function as a rule from inputs to outputs, and how its knobs shift and stretch its graph.
    visualisers: [functions]
    lesson: functions-graphs
  - id: exponents-logs
    title: Exponents, logarithms and e
    track: math-toolkit
    summary: Repeated doubling and its inverse, why logs turn products into sums, and where e comes from.
    prereqs: [functions-graphs]
    visualisers: [logarithms]
    lesson: exponents-logs
  - id: sums-notation
    title: Sums, products and reading math notation
    track: math-toolkit
    summary: Σ, Π, subscripts and hats read aloud, and every sum written as a loop.
    prereqs: [functions-graphs]
    visualisers: [sigma-notation]
    lesson: sums-notation
  - id: trigonometry
    title: Angles, sine and cosine
    track: math-toolkit
    summary: Radians, the unit circle, and sine and cosine as the shadows of a turning point.
    prereqs: [functions-graphs]
    visualisers: [unit-circle]
    lesson: trigonometry
  - id: floating-point
    title: Floating-point numbers
    track: math-toolkit
    summary: How computers store real numbers in 32 bits, and why 0.1 + 0.2 isn’t quite 0.3.
    prereqs: [exponents-logs]
    visualisers: [floating-point]
    lesson: floating-point

  # ── Linear algebra ───────────────────────────────────────────
  - id: vectors
    title: Vectors
    track: linear-algebra
    summary: Arrows with a length and a direction, added tip to tail, and a data point as a vector.
    prereqs: [functions-graphs, trigonometry]
    visualisers: [vectors]
    lesson: vectors
  - id: dot-product
    title: The dot product and similarity
    track: linear-algebra
    summary: Multiply matching parts and add them up, to measure how much two vectors point the same way.
    prereqs: [vectors, sums-notation]
    visualisers: [dot-product]
    lesson: dot-product
  - id: norms-distances
    title: Lengths and distances
    track: linear-algebra
    summary: L1, L2 and L∞, three ways to measure how far apart two points are.
    prereqs: [dot-product]
    visualisers: [norms]
    lesson: norms-distances
  - id: vectors-matrices
    title: Matrices as transformations
    track: linear-algebra
    summary: Matrices as transformations that warp space.
    prereqs: [dot-product]
    visualisers: [linear-transformations]
    lesson: linear-transformations
  - id: matrix-multiplication
    title: Matrix multiplication
    track: linear-algebra
    summary: Each cell is a row times a column, composing two transformations, and why AB isn’t BA.
    prereqs: [vectors-matrices, big-o]
    visualisers: [matrix-multiplication]
    lesson: matrix-multiplication
  - id: determinants-inverses
    title: Determinants, inverses and solving Ax = b
    track: linear-algebra
    summary: How much a matrix scales area, when it can be undone, and solving equations by elimination.
    prereqs: [matrix-multiplication]
    visualisers: [inverse-matrix]
    lesson: determinants-inverses
  - id: span-basis-rank
    title: Span, basis and rank
    track: linear-algebra
    summary: Which points a set of vectors can reach, and how many directions a matrix really keeps.
    prereqs: [determinants-inverses]
    visualisers: [span]
    lesson: span-basis-rank
  - id: change-of-basis
    title: Change of basis
    track: linear-algebra
    summary: One vector read on two grids, and why a transformation is simplest in its own eigenbasis.
    prereqs: [span-basis-rank]
    visualisers: [change-of-basis]
    lesson: change-of-basis
  - id: projections-least-squares
    title: Projections and least squares
    track: linear-algebra
    summary: The best-fitting line as a shadow, dropping a point perpendicular onto a space.
    prereqs: [span-basis-rank, supervised-learning]
    visualisers: [least-squares]
    lesson: projections-least-squares
  - id: orthogonality
    title: Orthogonality and Gram–Schmidt
    track: linear-algebra
    summary: Perpendicular directions, and straightening any basis into a set of them.
    prereqs: [projections-least-squares]
    planned: true
  - id: eigenvectors
    title: Eigenvectors
    track: linear-algebra
    summary: The directions a transformation only stretches.
    prereqs: [vectors-matrices, matrix-multiplication]
    visualisers: [eigenvectors]
    lesson: eigenvectors
  - id: symmetric-matrices-spectral
    title: Symmetric matrices and quadratic forms
    track: linear-algebra
    summary: Why a symmetric matrix stretches along perpendicular axes, and the ellipses and saddles of xᵀAx.
    prereqs: [eigenvectors, orthogonality]
    planned: true
  - id: svd
    title: Singular value decomposition
    track: linear-algebra
    summary: Any matrix as a sum of rank-1 pieces, most important first, and why that compresses images.
    prereqs: [eigenvectors]
    visualisers: [svd]
    lesson: svd
    later: [symmetric-matrices-spectral] # B8
  - id: tensors-shapes
    title: Tensors, shapes and broadcasting
    track: linear-algebra
    summary: Batches of matrices as stacked tables, and the shape rules every model obeys.
    prereqs: [matrix-multiplication]
    planned: true
  - id: high-dimensions
    title: Geometry in high dimensions
    track: linear-algebra
    summary: Why random directions are nearly perpendicular, and where the volume of a ball goes.
    prereqs: [dot-product, sampling-clt]
    planned: true

  # ── Calculus and optimisation ────────────────────────────────
  - id: contour-maps
    title: Functions of two variables
    track: calculus
    summary: Surfaces read as contour maps, and the curves you get by slicing through them.
    prereqs: [functions-graphs, vectors]
    planned: true
  - id: derivatives-gradients
    title: Derivatives and gradients
    track: calculus
    summary: Slopes in one dimension, and the direction of steepest ascent in many.
    prereqs: [functions-graphs]
    visualisers: [derivative]
    lesson: derivatives-gradients
    later: [contour-maps] # B4
  - id: derivative-rules
    title: Derivative rules
    track: calculus
    summary: The derivatives of products, exp, log, sigmoid and ReLU, and checking them numerically.
    prereqs: [derivatives-gradients, exponents-logs]
    planned: true
  - id: chain-rule
    title: The chain rule
    track: calculus
    summary: How changes flow through a computation graph, one link at a time.
    prereqs: [derivatives-gradients]
    visualisers: [chain-rule]
    lesson: backpropagation
    links:
      - href: /code/neuron-gradients
        label: 'Build micrograd: backprop through a neuron'
    later: [derivative-rules] # B4
  - id: taylor-approximation
    title: Linear and quadratic approximation
    track: calculus
    summary: Replacing a curve by its tangent line or parabola near a point, and Newton’s method.
    prereqs: [derivative-rules]
    planned: true
  - id: jacobians
    title: 'Jacobians: the local linear map'
    track: calculus
    summary: Zoom in far enough and any smooth map looks like a matrix, which is what backprop multiplies.
    prereqs: [chain-rule, matrix-multiplication]
    planned: true
  - id: integrals
    title: Integrals as accumulated area
    track: calculus
    summary: Adding up thin slices, and how accumulated area undoes the derivative.
    prereqs: [derivatives-gradients, sums-notation]
    planned: true
  - id: hessian-curvature
    title: Curvature and the Hessian
    track: calculus
    summary: Second derivatives in every direction, ravines and saddles, and why descent zigzags.
    prereqs: [taylor-approximation, jacobians, symmetric-matrices-spectral]
    planned: true
  - id: convexity
    title: Convexity
    track: calculus
    summary: Bowls with a single bottom, where every start leads to the same minimum.
    prereqs: [hessian-curvature, gradient-descent]
    planned: true
  - id: constrained-optimisation
    title: Lagrange multipliers
    track: calculus
    summary: Optimising along a constraint, at the point where the two gradients line up.
    prereqs: [convexity]
    planned: true

  # ── Probability and statistics ───────────────────────────────
  - id: counting-combinatorics
    title: Counting and combinations
    track: probability
    summary: Counting arrangements and choices, and Pascal’s triangle.
    prereqs: [sums-notation, exponents-logs]
    planned: true
  - id: probability-basics
    title: Chance, events and independence
    track: probability
    summary: Events as regions of outcomes, adding and multiplying chances, and when events are independent.
    prereqs: [counting-combinatorics]
    planned: true
  - id: probability
    title: Probability and Bayes
    track: probability
    summary: Conditional probability as areas, and updating beliefs with evidence.
    visualisers: [bayes]
    lesson: bayes
    later: [probability-basics] # B5
  - id: random-variables
    title: Random variables, expectation and variance
    track: probability
    summary: Numbers decided by chance, their average, and how far they spread.
    prereqs: [probability-basics]
    planned: true
  - id: law-of-large-numbers
    title: The law of large numbers and Monte Carlo
    track: probability
    summary: Why averages settle down, how fast, and estimating anything by simulation.
    prereqs: [random-variables]
    planned: true
  - id: continuous-distributions
    title: Densities and the normal distribution
    track: probability
    summary: Probability as area under a density curve, the CDF, and the bell curve.
    prereqs: [random-variables, integrals]
    planned: true
  - id: sampling-clt
    title: Sampling and the central limit theorem
    track: probability
    summary: Why averages of almost anything pile up into a bell curve, and how fast they settle.
    prereqs: [probability]
    visualisers: [central-limit-theorem]
    lesson: central-limit-theorem
    later: [law-of-large-numbers, continuous-distributions] # B5
  - id: covariance-correlation
    title: Covariance and correlation
    track: probability
    summary: How two quantities move together, and why correlation is a cosine.
    prereqs: [random-variables, dot-product]
    planned: true
  - id: information-theory
    title: Entropy and KL divergence
    track: probability
    summary: Information as surprise in bits, and the cost of believing the wrong distribution.
    prereqs: [probability, exponents-logs]
    visualisers: [entropy]
    lesson: entropy
    later: [random-variables] # B5
  - id: maximum-likelihood
    title: Maximum likelihood
    track: probability
    summary: Choosing the parameters that make the data most probable, and why that gives squared error and cross-entropy.
    prereqs: [random-variables, derivatives-gradients, exponents-logs]
    planned: true
  - id: estimation-confidence
    title: Standard errors, confidence intervals and the bootstrap
    track: probability
    summary: How far an estimate could be from the truth, and what 95% really promises.
    prereqs: [sampling-clt]
    planned: true
  - id: hypothesis-testing
    title: Hypothesis tests and p-values
    track: probability
    summary: Whether chance alone could explain a difference, permutation tests, and the trap of testing many things at once.
    prereqs: [estimation-confidence]
    planned: true
  - id: gaussian-multivariate
    title: The multivariate Gaussian
    track: probability
    summary: Bell curves in many dimensions, shaped by a covariance matrix, and sampled by warping noise.
    prereqs: [covariance-correlation, continuous-distributions, symmetric-matrices-spectral]
    planned: true
  - id: markov-chains
    title: Markov chains
    track: probability
    summary: Random steps that depend only on where you are, the distribution they settle into, and PageRank.
    prereqs: [probability-basics, matrix-multiplication, eigenvectors]
    planned: true

  # ── Classical machine learning ───────────────────────────────
  - id: supervised-learning
    title: What learning from examples means
    track: ml
    summary: Features, labels, a model with knobs and a loss, and why a test set keeps you honest.
    prereqs: [functions-graphs, vectors]
    visualisers: [supervised-learning]
    lesson: supervised-learning
  - id: gradient-descent
    title: Gradient descent
    track: ml
    summary: Walking downhill on a loss surface, and why the step size matters.
    prereqs: [derivatives-gradients]
    visualisers: [gradient-descent]
    lesson: gradient-descent
  - id: optimizers
    title: Momentum and Adam
    track: ml
