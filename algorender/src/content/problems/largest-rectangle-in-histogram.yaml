title: Largest Rectangle Under a Bar Chart
difficulty: hard
patterns: [monotonic-stack]
why: >-
  The best rectangle as tall as bar i stretches to the nearest lower bar on each side: a "next
  smaller item" question in both directions, which one stack of rising heights answers.
summary: Find the area of the largest rectangle that fits under a bar chart.
statement: |
  You are given `heights`, the heights of the bars in a bar chart, from left to right. Every bar is
  1 unit wide, and the bars stand side by side with no gaps.

  Return the area of the largest rectangle that fits entirely inside the chart: its bottom on the
  baseline, its sides on bar edges, and its top no higher than any bar it covers.
constraints:
  - "`heights` holds 1 to 10⁵ bars."
  - "Every height is between 0 and 10⁴."
signature:
  function: largestRectangleArea
  params:
    - { name: heights, type: "int[]" }
  returns: int
examples:
  - input: { heights: [2, 4, 5, 3, 1, 3] }
    output: 9
    explanation: "A rectangle 3 high spans the bars 4, 5 and 3: 3 × 3 = 9."
  - input: { heights: [6, 2] }
    output: 6
    explanation: "The tall bar alone (6 × 1) beats the short one stretched across both (2 × 2)."
tests:
  - input: { heights: [7] }
    output: 7
  - input: { heights: [0] }
    output: 0
  - input: { heights: [1, 1, 1, 1, 1] }
    output: 5
  - input: { heights: [1, 2, 3, 4, 5] }
    output: 9
  - input: { heights: [5, 4, 3, 2, 1] }
    output: 9
  - input: { heights: [2, 0, 2] }
    output: 2
  - input: { heights: [10000, 10000, 10000] }
    output: 30000
generated: { count: 8, seed: 33 }
hints:
  - "Suppose the rectangle's height is exactly bar i's height. How far left and right can it stretch?"
  - "It stretches until it meets a lower bar on each side. So for every bar you need the nearest lower bar on its left and on its right."
  - "Keep a stack of bar indices with rising heights. When a lower bar arrives, it is the right edge for every taller bar it pops, and the bar left on the stack below each popped one is that bar's left edge."
  - "Pretend there is one more bar of height 0 at the end, so every bar gets popped."
approach: |
  The largest rectangle is as tall as the lowest bar it covers, and stretches from just after the
  nearest lower bar on that bar's left to just before the nearest lower bar on its right. So it is
  enough to find, for every bar, those two neighbours.

  Scan the bars with a stack of indices whose heights rise from bottom to top. Before pushing bar
  `i`, pop every bar at least as tall as it. For a popped bar, `i` is where its rectangle must stop
  on the right, and the bar now on top of the stack is where it must stop on the left (with an
  empty stack, it reaches the first bar). Its area is its height times the width between them.
  (A bar popped by an equal one may get too narrow a width, but the equal bar later covers the same
  rectangle in full.) A final bar of height 0 pops everything. Every bar is pushed and popped once.
complexity: { time: "O(n)", space: "O(n)" }
solutions:
  python: |
    def largest_rectangle_area(heights: list[int]) -> int:
        best = 0
        stack = []  # indices of bars with rising heights
        for i in range(len(heights) + 1):
            h = heights[i] if i < len(heights) else 0
            while stack and heights[stack[-1]] >= h:
                height = heights[stack.pop()]
                left = stack[-1] + 1 if stack else 0
                best = max(best, height * (i - left))
            stack.append(i)
        return best
  typescript: |
    function largestRectangleArea(heights: number[]): number {
      const n = heights.length;
      const stack: number[] = []; // indices of bars with rising heights
      let best = 0;
      for (let i = 0; i <= n; i++) {
        const h = i < n ? heights[i] : 0;
        while (stack.length > 0 && heights[stack[stack.length - 1]] >= h) {
          const height = heights[stack.pop()!];
          const left = stack.length > 0 ? stack[stack.length - 1] + 1 : 0;
          best = Math.max(best, height * (i - left));
        }
        stack.push(i);
      }
      return best;
    }
  java: |
    class Solution {
        public int largestRectangleArea(int[] heights) {
            int n = heights.length;
            Deque<Integer> stack = new ArrayDeque<>(); // indices of bars with rising heights
            int best = 0;
            for (int i = 0; i <= n; i++) {
                int h = i < n ? heights[i] : 0; // a bar of height 0 at the end empties the stack
                while (!stack.isEmpty() && heights[stack.peek()] >= h) {
                    int height = heights[stack.pop()];
                    int left = stack.isEmpty() ? 0 : stack.peek() + 1;
                    best = Math.max(best, height * (i - left));
                }
                stack.push(i);
            }
            return best;
        }
    }
  cpp: |
    class Solution {
    public:
        int largestRectangleArea(vector<int>& heights) {
            int n = heights.size();
            vector<int> stack; // indices of bars with rising heights
            int best = 0;
            for (int i = 0; i <= n; i++) {
                int h = i < n ? heights[i] : 0; // a bar of height 0 at the end empties the stack
                while (!stack.empty() && heights[stack.back()] >= h) {
                    int height = heights[stack.back()];
                    stack.pop_back();
                    int left = stack.empty() ? 0 : stack.back() + 1;
                    best = max(best, height * (i - left));
                }
                stack.push_back(i);
            }
            return best;
        }
    };
  go: |
    func largestRectangleArea(heights []int) int {
    	n := len(heights)
    	var stack []int // indices of bars with rising heights
    	best := 0
    	for i := 0; i <= n; i++ {
    		h := 0 // a bar of height 0 at the end empties the stack
    		if i < n {
    			h = heights[i]
    		}
    		for len(stack) > 0 && heights[stack[len(stack)-1]] >= h {
    			height := heights[stack[len(stack)-1]]
    			stack = stack[:len(stack)-1]
    			left := 0
    			if len(stack) > 0 {
    				left = stack[len(stack)-1] + 1
    			}
    			best = max(best, height*(i-left))
    		}
    		stack = append(stack, i)
    	}
    	return best
    }
