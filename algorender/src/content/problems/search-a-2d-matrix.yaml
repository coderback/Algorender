title: Search a Sorted Grid
difficulty: medium
patterns: [binary-search]
why: >-
  Read row after row, the grid is one sorted list, so a single binary search over positions 0 to
  m·n − 1 finds the target; division turns each position into a row and a column.
summary: Decide whether a target is in a grid whose rows, read in order, form one sorted list.
statement: |
  You are given an m × n grid of integers `matrix` with two properties: each row is sorted in
  increasing order, and each row's first number is greater than the last number of the row above.
  So reading the rows one after another gives a single sorted list.

  Return `true` if `target` is in `matrix`, and `false` otherwise, in O(log(m · n)) time.
constraints:
  - "1 ≤ m, n ≤ 100"
  - "Every number, and `target`, is between −10⁴ and 10⁴."
signature:
  function: searchMatrix
  params:
    - { name: matrix, type: "int[][]" }
    - { name: target, type: int }
  returns: bool
examples:
  - input: { matrix: [[1, 4, 6], [9, 12, 15], [20, 25, 31]], target: 12 }
    output: true
  - input: { matrix: [[1, 4, 6], [9, 12, 15], [20, 25, 31]], target: 7 }
    output: false
    explanation: "7 would fall between 6, the end of row 0, and 9, the start of row 1."
tests:
  - input: { matrix: [[5]], target: 5 }
    output: true
  - input: { matrix: [[5]], target: 6 }
    output: false
  - input: { matrix: [[1, 3]], target: 3 }
    output: true
  - input: { matrix: [[1], [3], [5]], target: 4 }
    output: false
  - input: { matrix: [[-10, -5], [0, 4], [8, 10000]], target: 10000 }
    output: true
  - input: { matrix: [[2, 4, 6, 8], [10, 12, 14, 16]], target: 1 }
    output: false
generated: { count: 8, seed: 37 }
hints:
  - "If you read the grid row by row, what do you get?"
  - "Treat the grid as one sorted list of length m · n. Position `p` in that list is at row `p // n`, column `p % n`."
  - "Binary search over positions 0 to m · n − 1, reading each middle position from the grid."
approach: |
  Reading the rows in order gives one sorted list of `m · n` numbers, so binary search it without
  building it. Keep `lo = 0` and `hi = m · n − 1`. The number at position `mid` is
  `matrix[mid // n][mid % n]`: the row is how many full rows come before it, and the column is
  what's left over. Compare it with `target` and halve the range, as in an ordinary binary search.

  Searching for the right row first, then within that row, also takes O(log m + log n), the same.
complexity: { time: "O(log(m · n))", space: "O(1)" }
solutions:
  python: |
    def search_matrix(matrix: list[list[int]], target: int) -> bool:
        rows, cols = len(matrix), len(matrix[0])
        lo, hi = 0, rows * cols - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            row, col = mid // cols, mid % cols
            if matrix[row][col] == target:
                return True
            if matrix[row][col] < target:
                lo = mid + 1
            else:
                hi = mid - 1
        return False
  typescript: |
    function searchMatrix(matrix: number[][], target: number): boolean {
      const rows = matrix.length;
      const cols = matrix[0].length;
      let lo = 0;
      let hi = rows * cols - 1;
      while (lo <= hi) {
        const mid = Math.floor((lo + hi) / 2);
        const row = Math.floor(mid / cols);
        const col = mid % cols;
        if (matrix[row][col] === target) return true;
        if (matrix[row][col] < target) lo = mid + 1;
        else hi = mid - 1;
      }
      return false;
    }
  java: |
    class Solution {
        public boolean searchMatrix(int[][] matrix, int target) {
            int rows = matrix.length, cols = matrix[0].length;
            int lo = 0, hi = rows * cols - 1;
            while (lo <= hi) {
                int mid = (lo + hi) / 2;
                int value = matrix[mid / cols][mid % cols];
                if (value == target) return true;
                if (value < target) lo = mid + 1;
                else hi = mid - 1;
            }
            return false;
        }
    }
  cpp: |
    class Solution {
    public:
        bool searchMatrix(vector<vector<int>>& matrix, int target) {
            int rows = matrix.size(), cols = matrix[0].size();
            int lo = 0, hi = rows * cols - 1;
            while (lo <= hi) {
                int mid = (lo + hi) / 2;
                int value = matrix[mid / cols][mid % cols];
                if (value == target) return true;
                if (value < target) lo = mid + 1;
                else hi = mid - 1;
            }
            return false;
        }
    };
  go: |
    func searchMatrix(matrix [][]int, target int) bool {
    	rows, cols := len(matrix), len(matrix[0])
    	lo, hi := 0, rows*cols-1
    	for lo <= hi {
    		mid := (lo + hi) / 2
    		value := matrix[mid/cols][mid%cols]
    		if value == target {
    			return true
    		}
    		if value < target {
    			lo = mid + 1
    		} else {
    			hi = mid - 1
    		}
    	}
    	return false
    }
