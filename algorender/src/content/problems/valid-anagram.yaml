title: Same Letters, Different Order
difficulty: easy
patterns: [hashing]
why: >-
  Two words are anagrams exactly when every letter appears equally often in both. Counting letters
  is a job for a hash map (or a table of 26 counts).
summary: Decide whether one word is a rearrangement of another.
statement: |
  You are given two strings `s` and `t` of lowercase English letters.

  Return `true` if `t` is an anagram of `s`: it uses exactly the same letters, each exactly as many
  times, possibly in a different order. Otherwise return `false`.
constraints:
  - "`s` and `t` each hold 1 to 5 × 10⁴ letters."
  - "Both contain only the lowercase letters `a` to `z`."
signature:
  function: isAnagram
  params:
    - { name: s, type: string }
    - { name: t, type: string }
  returns: bool
examples:
  - input: { s: "listen", t: "silent" }
    output: true
    explanation: "Both use `e`, `i`, `l`, `n`, `s` and `t` once each."
  - input: { s: "aab", t: "abb" }
    output: false
    explanation: "Both use only `a` and `b`, but `s` has two `a`s and `t` has one."
tests:
  - input: { s: "a", t: "a" }
    output: true
  - input: { s: "a", t: "b" }
    output: false
  - input: { s: "ab", t: "abc" }
    output: false
  - input: { s: "zzzy", t: "yzzz" }
    output: true
  - input: { s: "abcabc", t: "aabbcc" }
    output: true
  - input: { s: "aaab", t: "abbb" }
    output: false
generated: { count: 8, seed: 22 }
hints:
  - "If two words are anagrams, what must be true about how often each letter appears?"
  - "Count each letter of `s`, then walk through `t` taking letters away. What tells you the answer is no?"
  - "Strings of different lengths can never be anagrams: check that first."
approach: |
  If the lengths differ, return `false`. Otherwise count each letter of `s` in a hash map (or an
  array of 26 counts), then walk through `t`, taking one off the count of each of its letters. If a
  count is already 0 when you need to take one off, `t` uses that letter more often than `s` does:
  return `false`. If you get to the end, every count matched, so the strings are anagrams.

  Sorting both strings and comparing them also works, in O(n log n).
complexity: { time: "O(n)", space: "O(1): at most 26 counts" }
solutions:
  python: |
    def is_anagram(s: str, t: str) -> bool:
        if len(s) != len(t):
            return False
        counts = {}
        for ch in s:
            counts[ch] = counts.get(ch, 0) + 1
        for ch in t:
            if counts.get(ch, 0) == 0:
                return False
            counts[ch] -= 1
        return True
  typescript: |
    function isAnagram(s: string, t: string): boolean {
      if (s.length !== t.length) return false;
      const counts = new Map<string, number>();
      for (const ch of s) counts.set(ch, (counts.get(ch) ?? 0) + 1);
      for (const ch of t) {
        const left = counts.get(ch) ?? 0;
        if (left === 0) return false;
        counts.set(ch, left - 1);
      }
      return true;
    }
visualisers: [hash-table]
