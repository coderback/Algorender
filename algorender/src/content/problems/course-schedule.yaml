title: Can Every Course Be Taken?
difficulty: medium
patterns: [topological-sort, graphs]
why: >-
  Prerequisites form a directed graph, and every course can be finished exactly when that graph has
  no cycle. Repeatedly taking a course whose prerequisites are all done (a topological sort) either
  uses up every course or exposes a loop.
summary: Decide whether a set of prerequisites still lets you take every course.
statement: |
  There are `numCourses` courses, numbered from 0 to `numCourses − 1`. Each pair `[a, b]` in
  `prerequisites` means you must finish course `b` before you can take course `a`.

  Return `true` if there is an order in which you can take every course, and `false` if the
  prerequisites make that impossible.
constraints:
  - "1 ≤ `numCourses` ≤ 2000"
  - "`prerequisites` holds at most 5000 pairs, each of two different courses, with no pair repeated."
signature:
  function: canFinish
  params:
    - { name: numCourses, type: int }
    - { name: prerequisites, type: "int[][]" }
  returns: bool
view: memory
examples:
  - input: { numCourses: 4, prerequisites: [[2, 0], [2, 1], [3, 2]] }
    output: true
    explanation: "Take 0 and 1, then 2, then 3."
  - input: { numCourses: 3, prerequisites: [[0, 1], [1, 2], [2, 0]] }
    output: false
    explanation: "0 waits for 1, 1 waits for 2, and 2 waits for 0, so none of them can go first."
tests:
  - input: { numCourses: 1, prerequisites: [] }
    output: true
  - input: { numCourses: 5, prerequisites: [] }
    output: true
  - input: { numCourses: 3, prerequisites: [[0, 1], [1, 0], [2, 0]] }
    output: false
  - input: { numCourses: 4, prerequisites: [[1, 0], [2, 1], [3, 2], [1, 3]] }
    output: false
  - input: { numCourses: 6, prerequisites: [[1, 0], [2, 0], [3, 1], [3, 2], [5, 4]] }
    output: true
generated: { count: 8, seed: 44 }
hints:
  - "Draw each course as a node and each pair as an arrow from the prerequisite to the course. When is finishing everything impossible?"
  - "A loop of courses waiting on each other blocks all of them: you are looking for a cycle in a directed graph."
  - "Count each course's unfinished prerequisites. Repeatedly take a course whose count is 0 and lower the counts of the courses it unlocks. Everything can be finished if this takes all `numCourses` courses."
approach: |
  Kahn's algorithm. Count each course's prerequisites (its in-degree) and list the courses each one
  unlocks. Start with every course that has no prerequisites. Repeatedly take one of them, count it
  as taken, and lower the count of each course it unlocks, adding any that reach 0 to the courses
  ready to take.

  If every course gets taken, the answer is `true`. A course on a cycle always waits for another
  course on the same cycle, so its count never reaches 0; if any course is left over, the answer is
  `false`.

  A depth-first search that marks courses as "in progress" and "done", and finds a cycle when it
  meets an "in progress" course again, works as well.
complexity: { time: "O(V + E)", space: "O(V + E)" }
solutions:
  python: |
    def can_finish(num_courses: int, prerequisites: list[list[int]]) -> bool:
        unlocks = [[] for _ in range(num_courses)]
        waiting = [0] * num_courses  # prerequisites not yet taken
        for course, before in prerequisites:
            unlocks[before].append(course)
            waiting[course] += 1
        ready = [c for c in range(num_courses) if waiting[c] == 0]
        taken = 0
        while ready:
            course = ready.pop()
            taken += 1
            for nxt in unlocks[course]:
                waiting[nxt] -= 1
                if waiting[nxt] == 0:
                    ready.append(nxt)
        return taken == num_courses
  typescript: |
    function canFinish(numCourses: number, prerequisites: number[][]): boolean {
      const unlocks: number[][] = Array.from({ length: numCourses }, () => []);
      const waiting = new Array<number>(numCourses).fill(0); // prerequisites not yet taken
      for (const [course, before] of prerequisites) {
        unlocks[before].push(course);
        waiting[course]++;
      }
      const ready: number[] = [];
      for (let c = 0; c < numCourses; c++) if (waiting[c] === 0) ready.push(c);
      let taken = 0;
      while (ready.length > 0) {
        const course = ready.pop()!;
        taken++;
        for (const next of unlocks[course]) {
          if (--waiting[next] === 0) ready.push(next);
        }
      }
      return taken === numCourses;
    }
  java: |
    class Solution {
        public boolean canFinish(int numCourses, int[][] prerequisites) {
            List<List<Integer>> unlocks = new ArrayList<>();
            for (int c = 0; c < numCourses; c++) unlocks.add(new ArrayList<>());
            int[] waiting = new int[numCourses]; // prerequisites not yet taken
            for (int[] pair : prerequisites) {
                unlocks.get(pair[1]).add(pair[0]);
                waiting[pair[0]]++;
            }
            Deque<Integer> ready = new ArrayDeque<>();
            for (int c = 0; c < numCourses; c++) if (waiting[c] == 0) ready.push(c);
            int taken = 0;
            while (!ready.isEmpty()) {
                int course = ready.pop();
                taken++;
                for (int next : unlocks.get(course)) {
                    if (--waiting[next] == 0) ready.push(next);
                }
            }
            return taken == numCourses;
        }
    }
  cpp: |
    class Solution {
    public:
        bool canFinish(int numCourses, vector<vector<int>>& prerequisites) {
            vector<vector<int>> unlocks(numCourses);
            vector<int> waiting(numCourses, 0); // prerequisites not yet taken
            for (auto& pair : prerequisites) {
                unlocks[pair[1]].push_back(pair[0]);
                waiting[pair[0]]++;
            }
            vector<int> ready;
            for (int c = 0; c < numCourses; c++) if (waiting[c] == 0) ready.push_back(c);
            int taken = 0;
            while (!ready.empty()) {
                int course = ready.back();
                ready.pop_back();
                taken++;
                for (int next : unlocks[course]) {
                    if (--waiting[next] == 0) ready.push_back(next);
                }
            }
            return taken == numCourses;
        }
    };
  go: |
    func canFinish(numCourses int, prerequisites [][]int) bool {
    	unlocks := make([][]int, numCourses)
    	waiting := make([]int, numCourses) // prerequisites not yet taken
    	for _, pair := range prerequisites {
    		course, before := pair[0], pair[1]
    		unlocks[before] = append(unlocks[before], course)
    		waiting[course]++
    	}
    	var ready []int
    	for c := range numCourses {
    		if waiting[c] == 0 {
    			ready = append(ready, c)
    		}
    	}
    	taken := 0
    	for len(ready) > 0 {
    		course := ready[len(ready)-1]
    		ready = ready[:len(ready)-1]
    		taken++
    		for _, next := range unlocks[course] {
    			waiting[next]--
    			if waiting[next] == 0 {
    				ready = append(ready, next)
    			}
    		}
    	}
    	return taken == numCourses
    }
