title: Search a Rotated Sorted List
difficulty: medium
patterns: [binary-search]
why: >-
  However the list was rotated, at least one of the two halves around the middle is in order, and
  you can tell which. Checking whether the target fits in that half tells you which half to keep.
summary: Find a target's position in a rotated sorted list in logarithmic time.
statement: |
  A list of different integers was sorted in increasing order and then rotated by some amount
  (possibly none): some items were moved, in order, from the end to the front, the way
  `[2, 5, 8, 9, 13]` can become `[9, 13, 2, 5, 8]`.

  Given the rotated list `nums` and an integer `target`, return the index of `target` in `nums`, or
  `-1` if it isn't there. Your solution should take O(log n) time.
constraints:
  - "`nums` holds 1 to 5000 numbers, all different."
  - "Every number, and `target`, is between −10⁴ and 10⁴."
  - "`nums` is an increasing list rotated by some amount from 0 to n − 1."
signature:
  function: searchRotated
  params:
    - { name: nums, type: "int[]" }
    - { name: target, type: int }
  returns: int
examples:
  - input: { nums: [9, 13, 2, 5, 8], target: 5 }
    output: 3
  - input: { nums: [9, 13, 2, 5, 8], target: 10 }
    output: -1
    explanation: "10 would belong between 9 and 13, and it isn't there."
tests:
  - input: { nums: [4], target: 4 }
    output: 0
  - input: { nums: [4], target: 3 }
    output: -1
  - input: { nums: [3, 1], target: 1 }
    output: 1
  - input: { nums: [1, 3], target: 3 }
    output: 1
  - input: { nums: [5, 6, 7, 8, 1, 2, 3], target: 5 }
    output: 0
  - input: { nums: [5, 6, 7, 8, 1, 2, 3], target: 3 }
    output: 6
  - input: { nums: [-3, 0, 2, 7, 10], target: 7 }
    output: 3
generated: { count: 8, seed: 40 }
hints:
  - "Pick the middle. Of the two halves on either side of it, at least one is in increasing order. How can you tell which?"
  - "If `nums[lo] ≤ nums[mid]`, the left half `nums[lo..mid]` is in order; otherwise the right half `nums[mid..hi]` is."
  - "In the half that is in order, comparing with its two ends tells you whether the target can be there. If it can, search that half; if not, search the other one."
approach: |
  Binary search, with one extra question at each step. Keep `[lo, hi]` and look at `mid`; if
  `nums[mid]` is the target, you're done. Otherwise one of the two halves is in order:

  - If `nums[lo] ≤ nums[mid]`, the left half is in order. If `nums[lo] ≤ target < nums[mid]`, the
    target can only be there: `hi = mid − 1`. Otherwise `lo = mid + 1`.
  - Otherwise the right half is in order. If `nums[mid] < target ≤ nums[hi]`, search it:
    `lo = mid + 1`. Otherwise `hi = mid − 1`.

  When the range runs out, the target isn't in the list.
complexity: { time: "O(log n)", space: "O(1)" }
solutions:
  python: |
    def search_rotated(nums: list[int], target: int) -> int:
        lo, hi = 0, len(nums) - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            if nums[mid] == target:
                return mid
            if nums[lo] <= nums[mid]:
                if nums[lo] <= target < nums[mid]:
                    hi = mid - 1
                else:
                    lo = mid + 1
            elif nums[mid] < target <= nums[hi]:
                lo = mid + 1
            else:
                hi = mid - 1
        return -1
  typescript: |
    function searchRotated(nums: number[], target: number): number {
      let lo = 0;
      let hi = nums.length - 1;
      while (lo <= hi) {
        const mid = Math.floor((lo + hi) / 2);
        if (nums[mid] === target) return mid;
        if (nums[lo] <= nums[mid]) {
          if (nums[lo] <= target && target < nums[mid]) hi = mid - 1;
          else lo = mid + 1;
        } else if (nums[mid] < target && target <= nums[hi]) {
          lo = mid + 1;
        } else {
          hi = mid - 1;
        }
      }
      return -1;
    }
  java: |
    class Solution {
        public int searchRotated(int[] nums, int target) {
            int lo = 0, hi = nums.length - 1;
            while (lo <= hi) {
                int mid = (lo + hi) / 2;
                if (nums[mid] == target) return mid;
                if (nums[lo] <= nums[mid]) { // the left half is in order
                    if (nums[lo] <= target && target < nums[mid]) hi = mid - 1;
                    else lo = mid + 1;
                } else if (nums[mid] < target && target <= nums[hi]) { // the right half is
                    lo = mid + 1;
                } else {
                    hi = mid - 1;
                }
            }
            return -1;
        }
    }
