title: Largest Sum of a Subarray
difficulty: medium
patterns: [greedy, dp-1d]
why: >-
  A running total that has dropped below zero can only drag down whatever comes after it, so you
  can safely drop it and start again: a greedy decision made once per item.
summary: Find the largest total of any non-empty run of consecutive numbers.
statement: |
  Given a list of integers `nums`, return the largest sum of a subarray: a non-empty run of
  consecutive items.

  The list may hold negative numbers. When every number is negative, the answer is the largest
  single number.
constraints:
  - "`nums` holds 1 to 10⁴ numbers."
  - "−10⁴ ≤ `nums[i]` ≤ 10⁴"
signature:
  function: maxSubArray
  params:
    - { name: nums, type: "int[]" }
  returns: int
examples:
  - input: { nums: [3, -4, 5, -1, 2, -6, 1] }
    output: 6
    explanation: "`[5, -1, 2]` adds up to 6."
  - input: { nums: [-3, -1, -2] }
    output: -1
    explanation: Every number is negative, so the best is the largest one on its own.
tests:
  - input: { nums: [7] }
    output: 7
  - input: { nums: [-5] }
    output: -5
  - input: { nums: [1, 2, 3] }
    output: 6
  - input: { nums: [2, -1, 2, -1, 2] }
    output: 4
  - input: { nums: [-2, 0, -1] }
    output: 0
  - input: { nums: [10000, -10000, 10000] }
    output: 10000
generated: { count: 8, seed: 33 }
hints:
  - "Think about the best subarray that *ends* at each position."
  - "The best subarray ending at position i is either `nums[i]` alone or the best one ending at i − 1 with `nums[i]` added. When is adding worse?"
  - "Keep a running total. If it is negative before you add `nums[i]`, start again from `nums[i]`. Track the largest running total you see."
approach: |
  Walk along the list keeping `running`, the largest sum of a subarray that ends at the current
  position. At each new number `x`, that subarray either extends the previous one (`running + x`)
  or starts afresh at `x`, whichever is larger; in other words, a negative running total is
  dropped, because it would only lower everything after it.

  Keep `best`, the largest `running` seen. Starting both at `nums[0]` handles lists where every
  number is negative. This is Kadane's algorithm; it is also the 1D table "best sum ending here",
  keeping only its last entry.
complexity: { time: "O(n)", space: "O(1)" }
solutions:
  python: |
    def max_sub_array(nums: list[int]) -> int:
        best = running = nums[0]
        for i in range(1, len(nums)):
            running = max(nums[i], running + nums[i])  # start again here, or extend the run
            best = max(best, running)
        return best
  typescript: |
    function maxSubArray(nums: number[]): number {
      let best = nums[0];
      let running = nums[0];
      for (let i = 1; i < nums.length; i++) {
        running = Math.max(nums[i], running + nums[i]); // start again here, or extend the run
        best = Math.max(best, running);
      }
      return best;
    }
