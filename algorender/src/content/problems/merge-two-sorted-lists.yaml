title: Merge Two Sorted Linked Lists
difficulty: easy
patterns: [linked-list]
why: >-
  You build one chain by repeatedly taking the smaller of two heads. A dummy node in front of the
  result and a pointer to its tail let you splice each node in without special cases.
summary: Splice two sorted linked lists into one sorted list.
statement: |
  You are given `list1` and `list2`, the heads of two singly linked lists (either may be empty).
  Each list's values are in non-decreasing order.

  Join them into a single list whose values are in non-decreasing order, by relinking the nodes you
  were given rather than making new ones, and return its head.

  Linked lists are written as their values from head to tail, so `[1, 4, 6]` is 1 → 4 → 6, and
  `[]` is an empty list.
constraints:
  - "Each list holds 0 to 5000 nodes."
  - "Every value is between −10⁴ and 10⁴."
  - "Each list is sorted in non-decreasing order."
signature:
  function: mergeTwoLists
  params:
    - { name: list1, type: ListNode }
    - { name: list2, type: ListNode }
  returns: ListNode
examples:
  - input: { list1: [2, 5, 9], list2: [1, 5, 6, 12] }
    output: [1, 2, 5, 5, 6, 9, 12]
  - input: { list1: [], list2: [3] }
    output: [3]
    explanation: Merging with an empty list leaves the other list as it is.
tests:
  - input: { list1: [], list2: [] }
    output: []
  - input: { list1: [4], list2: [] }
    output: [4]
  - input: { list1: [1, 1, 1], list2: [1, 1] }
    output: [1, 1, 1, 1, 1]
  - input: { list1: [-10, -3, 0], list2: [5, 7] }
    output: [-10, -3, 0, 5, 7]
  - input: { list1: [8, 9], list2: [-2, 3, 8, 10] }
    output: [-2, 3, 8, 8, 9, 10]
generated: { count: 8, seed: 34 }
hints:
  - "The merged list starts with the smaller of the two heads. What comes after it?"
  - "Keep a pointer to the last node of the merged list so far. Each step, attach the smaller of the two remaining heads and move that list on by one."
  - "Start the merged list with a dummy node, so the first attachment is no different from the rest. When one list runs out, attach what's left of the other in one go."
approach: |
  Make a dummy node and keep `tail`, the last node of the merged list so far, starting at the
  dummy. While both lists still have nodes, compare their heads, link the smaller one after `tail`,
  move that list on to its next node, and move `tail` to the node just linked.

  When one list runs out, the other's remaining nodes are already in order, so link them after
  `tail` all at once. The merged list starts at `dummy.next`.
complexity: { time: "O(n + m)", space: "O(1) extra" }
solutions:
  python: |
    def merge_two_lists(list1: ListNode | None, list2: ListNode | None) -> ListNode | None:
        dummy = ListNode(0)
        tail = dummy
        while list1 and list2:
            if list1.val <= list2.val:
                tail.next = list1
                list1 = list1.next
            else:
                tail.next = list2
                list2 = list2.next
            tail = tail.next
        tail.next = list1 if list1 else list2
        return dummy.next
  typescript: |
    function mergeTwoLists(list1: ListNode | null, list2: ListNode | null): ListNode | null {
      const dummy = new ListNode(0);
      let tail = dummy;
      while (list1 && list2) {
        if (list1.val <= list2.val) {
          tail.next = list1;
          tail = list1;
          list1 = list1.next;
        } else {
          tail.next = list2;
          tail = list2;
          list2 = list2.next;
        }
      }
      tail.next = list1 ?? list2;
      return dummy.next;
    }
