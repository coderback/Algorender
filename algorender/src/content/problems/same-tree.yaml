title: Identical Binary Trees
difficulty: easy
patterns: [trees]
why: >-
  Two trees are the same when their roots match and their left subtrees and right subtrees are each
  the same. The answer for a pair of nodes comes from the answers for their children: recursion.
summary: Decide whether two binary trees have the same shape and the same values.
statement: |
  You are given `p` and `q`, the roots of two binary trees (either may be empty).

  Return `true` if the trees are identical, with the same shape and equal values in matching
  places, and `false` otherwise.

  Trees are written in level order, row by row from the top, with `null` where a node is missing:
  `[4, 2, 7, null, 3]` is 4 at the root, 2 and 7 below it, and 3 as the right child of 2.
constraints:
  - "Each tree holds 0 to 500 nodes."
  - "Every value is between −10⁴ and 10⁴."
signature:
  function: isSameTree
  params:
    - { name: p, type: TreeNode }
    - { name: q, type: TreeNode }
  returns: bool
examples:
  - input: { p: [4, 2, 6, 1, 3], q: [4, 2, 6, 1, 3] }
    output: true
  - input: { p: [7, 5], q: [7, null, 5] }
    output: false
    explanation: The values match, but 5 is a left child in one tree and a right child in the other.
tests:
  - input: { p: [], q: [] }
    output: true
  - input: { p: [1], q: [] }
    output: false
  - input: { p: [3, 1, 2], q: [3, 2, 1] }
    output: false
  - input: { p: [0, -1, 1], q: [0, -1, 1] }
    output: true
  - input: { p: [1, 2, 3, 4], q: [1, 2, 3, null, 4] }
    output: false
  - input: { p: [2, 2, 2], q: [2, 2] }
    output: false
generated: { count: 8, seed: 43 }
hints:
  - "When are two empty trees the same? Can an empty tree be the same as a non-empty one?"
  - "For two non-empty trees, compare the roots' values, then ask the same question about the two left subtrees and about the two right subtrees."
approach: |
  Recurse on pairs of nodes, one from each tree. Two empty trees match. If only one is empty, or the
  two values differ, they don't. Otherwise the trees are identical exactly when the left subtrees
  are identical and the right subtrees are identical. The recursion stops at the first difference.
complexity: { time: "O(n), n the smaller tree's size", space: "O(h) for the recursion, h the height" }
solutions:
  python: |
    def is_same_tree(p: TreeNode | None, q: TreeNode | None) -> bool:
        if p is None and q is None:
            return True
        if p is None or q is None or p.val != q.val:
            return False
        return is_same_tree(p.left, q.left) and is_same_tree(p.right, q.right)
  typescript: |
    function isSameTree(p: TreeNode | null, q: TreeNode | null): boolean {
      if (p === null && q === null) return true;
      if (p === null || q === null || p.val !== q.val) return false;
      return isSameTree(p.left, q.left) && isSameTree(p.right, q.right);
    }
visualisers: [binary-tree]
