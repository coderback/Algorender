title: Merge Overlapping Intervals
difficulty: medium
patterns: [intervals]
why: >-
  Once intervals are sorted by start, any overlap is with the interval just before, so one pass
  that extends or closes the current interval merges everything.
summary: Combine every set of overlapping ranges into one.
statement: |
  You are given `intervals`, a list of ranges `[start, end]` with `start ≤ end`. Two ranges overlap
  if they share at least one point, so `[1, 3]` and `[3, 5]` overlap.

  Merge every group of overlapping ranges into a single range covering all of them, and return the
  merged ranges sorted by start.
constraints:
  - "`intervals` holds 1 to 10⁴ ranges."
  - "0 ≤ `start` ≤ `end` ≤ 10⁴"
signature:
  function: merge
  params:
    - { name: intervals, type: "int[][]" }
  returns: "int[][]"
view: memory
examples:
  - input: { intervals: [[1, 4], [8, 10], [2, 6], [15, 18]] }
    output: [[1, 6], [8, 10], [15, 18]]
    explanation: "`[1, 4]` and `[2, 6]` overlap, so they become `[1, 6]`."
  - input: { intervals: [[1, 3], [3, 5]] }
    output: [[1, 5]]
    explanation: Sharing the point 3 counts as overlapping.
tests:
  - input: { intervals: [[4, 7]] }
    output: [[4, 7]]
  - input: { intervals: [[1, 10], [2, 3], [4, 5]] }
    output: [[1, 10]]
  - input: { intervals: [[5, 6], [1, 2], [3, 4]] }
    output: [[1, 2], [3, 4], [5, 6]]
  - input: { intervals: [[0, 0], [0, 0], [1, 1]] }
    output: [[0, 0], [1, 1]]
generated: { count: 8, seed: 13 }
hints:
  - "If the ranges were sorted by start, which range could the next one possibly overlap?"
  - "Sort by start, then walk: either the next range starts inside the current merged one (extend its end) or it starts after it (begin a new one)."
approach: |
  Sort the ranges by start. Keep a list of merged ranges, starting with the first. For each next
  range, if its start is at most the last merged range's end, they overlap: stretch that end to the
  larger of the two ends. Otherwise the range begins a new merged range.
complexity: { time: "O(n log n)", space: "O(n) for the output" }
solutions:
  python: |
    def merge(intervals: list[list[int]]) -> list[list[int]]:
        merged = []
        for start, end in sorted(intervals):
            if merged and start <= merged[-1][1]:
                merged[-1][1] = max(merged[-1][1], end)
            else:
                merged.append([start, end])
        return merged
  typescript: |
    function merge(intervals: number[][]): number[][] {
      const sorted = [...intervals].sort((a, b) => a[0] - b[0]);
      const merged: number[][] = [];
      for (const [start, end] of sorted) {
        const last = merged[merged.length - 1];
        if (last && start <= last[1]) last[1] = Math.max(last[1], end);
        else merged.push([start, end]);
      }
      return merged;
    }
  java: |
    class Solution {
        public List<List<Integer>> merge(int[][] intervals) {
            Arrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0]));
            List<int[]> merged = new ArrayList<>();
            for (int[] range : intervals) {
                if (!merged.isEmpty() && range[0] <= merged.get(merged.size() - 1)[1]) {
                    int[] last = merged.get(merged.size() - 1);
                    last[1] = Math.max(last[1], range[1]);
                } else {
                    merged.add(new int[] {range[0], range[1]});
                }
            }
            List<List<Integer>> result = new ArrayList<>();
            for (int[] range : merged) result.add(List.of(range[0], range[1]));
            return result;
        }
    }
  cpp: |
    class Solution {
    public:
        vector<vector<int>> merge(vector<vector<int>>& intervals) {
            sort(intervals.begin(), intervals.end());
            vector<vector<int>> merged;
            for (auto& range : intervals) {
                if (!merged.empty() && range[0] <= merged.back()[1]) {
                    merged.back()[1] = max(merged.back()[1], range[1]);
                } else {
                    merged.push_back({range[0], range[1]});
                }
            }
            return merged;
        }
    };
  go: |
    func merge(intervals [][]int) [][]int {
    	sort.Slice(intervals, func(i, j int) bool { return intervals[i][0] < intervals[j][0] })
    	merged := [][]int{}
    	for _, r := range intervals {
    		if n := len(merged); n > 0 && r[0] <= merged[n-1][1] {
    			merged[n-1][1] = max(merged[n-1][1], r[1])
    		} else {
    			merged = append(merged, []int{r[0], r[1]})
    		}
    	}
    	return merged
    }
