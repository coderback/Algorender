            int n = values.size();
            vector<vector<int>> triples;
            for (int i = 0; i < n - 2; i++) {
                if (values[i] > 0) break;
                if (i > 0 && values[i] == values[i - 1]) continue;
                int left = i + 1, right = n - 1;
                while (left < right) {
                    int total = values[i] + values[left] + values[right];
                    if (total < 0) {
                        left++;
