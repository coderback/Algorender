title: Three Numbers That Sum to Zero
difficulty: medium
patterns: [two-pointers]
why: >-
  Fix one number and the rest is a pair-sum search. Sorting first lets two pointers find every
  pair in one sweep, and puts equal values side by side so repeated triples are easy to skip.
summary: List every different triple of numbers in a list that adds up to zero.
statement: |
  You are given a list of integers `nums`. Return every triple of values `[a, b, c]` with
  `a + b + c = 0`, where the three values come from three different positions in `nums`.

  List each triple of values only once: two triples holding the same three values (in any order)
  count as the same. Return the triples in any order, with the values inside each triple in any
  order.
constraints:
  - "`nums` holds 3 to 3000 numbers."
  - "Every number is between −10⁵ and 10⁵."
signature:
  function: threeSum
  params:
    - { name: nums, type: "int[]" }
  returns: "int[][]"
compare: unordered-deep
view: memory
examples:
  - input: { nums: [-3, 1, 2, 0, -1, 3] }
    output: [[-3, 0, 3], [-3, 1, 2], [-1, 0, 1]]
  - input: { nums: [2, -1, -1, 0] }
    output: [[-1, -1, 2]]
    explanation: "The two `-1`s sit at different positions, so a triple can use both."
  - input: { nums: [0, 0, 0, 0] }
    output: [[0, 0, 0]]
    explanation: "Many choices of three positions give `0, 0, 0`, but it is listed once."
tests:
  - input: { nums: [1, 2, 3] }
    output: []
  - input: { nums: [0, 0, 0] }
    output: [[0, 0, 0]]
  - input: { nums: [-2, 0, 1, 1, 2] }
    output: [[-2, 0, 2], [-2, 1, 1]]
  - input: { nums: [-4, -1, -1, 0, 1, 2, 2] }
    output: [[-4, 2, 2], [-1, -1, 2], [-1, 0, 1]]
  - input: { nums: [5, -5, 0] }
    output: [[-5, 0, 5]]
  - input: { nums: [100000, -100000, 0, 1] }
    output: [[-100000, 0, 100000]]
generated: { count: 8, seed: 28 }
hints:
  - "Trying every triple is O(n³). If you fix the first number `a`, what are you looking for among the rest?"
  - "You need two numbers that sum to `−a`. Sort the list first, and that becomes a pair search with two pointers."
  - "To avoid repeats, skip an `a` equal to the one before it, and after finding a triple, move the pointers past any equal values."
approach: |
  Sort a copy of the list. For each position `i`, let `nums[i]` be the smallest value of the
  triple. Skip it if it equals `nums[i − 1]`, since that value has already been tried. Then search
  the part after `i` with two pointers, `left = i + 1` and `right = n − 1`, for pairs summing to
  `−nums[i]`: a sum that is too small moves `left` right, too big moves `right` left. On a match,
  record the triple, then move `left` past every copy of its value (and `right` likewise) so the
  same triple isn't recorded twice.

  Once `nums[i]` is greater than 0 you can stop: three positive numbers can't sum to zero.
complexity: { time: "O(n²)", space: "O(n) for the sorted copy, besides the output" }
solutions:
  python: |
    def three_sum(nums: list[int]) -> list[list[int]]:
        values = sorted(nums)
        n = len(values)
        triples = []
        for i in range(n - 2):
            if values[i] > 0:
                break
            if i > 0 and values[i] == values[i - 1]:
                continue
            left, right = i + 1, n - 1
            while left < right:
                total = values[i] + values[left] + values[right]
                if total < 0:
                    left += 1
                elif total > 0:
                    right -= 1
                else:
                    triples.append([values[i], values[left], values[right]])
                    left += 1
                    right -= 1
                    while left < right and values[left] == values[left - 1]:
                        left += 1
                    while left < right and values[right] == values[right + 1]:
                        right -= 1
        return triples
  typescript: |
    function threeSum(nums: number[]): number[][] {
      const values = [...nums].sort((a, b) => a - b);
      const n = values.length;
      const triples: number[][] = [];
      for (let i = 0; i < n - 2; i++) {
        if (values[i] > 0) break;
        if (i > 0 && values[i] === values[i - 1]) continue;
        let left = i + 1;
        let right = n - 1;
        while (left < right) {
          const total = values[i] + values[left] + values[right];
          if (total < 0) left++;
          else if (total > 0) right--;
          else {
            triples.push([values[i], values[left], values[right]]);
            left++;
            right--;
            while (left < right && values[left] === values[left - 1]) left++;
            while (left < right && values[right] === values[right + 1]) right--;
          }
        }
      }
      return triples;
    }
  java: |
    class Solution {
        public List<List<Integer>> threeSum(int[] nums) {
            int[] values = nums.clone();
            Arrays.sort(values);
            int n = values.length;
            List<List<Integer>> triples = new ArrayList<>();
            for (int i = 0; i < n - 2; i++) {
                if (values[i] > 0) break;
                if (i > 0 && values[i] == values[i - 1]) continue;
                int left = i + 1, right = n - 1;
                while (left < right) {
                    int total = values[i] + values[left] + values[right];
                    if (total < 0) {
                        left++;
                    } else if (total > 0) {
                        right--;
                    } else {
                        triples.add(List.of(values[i], values[left], values[right]));
                        left++;
                        right--;
                        while (left < right && values[left] == values[left - 1]) left++;
                        while (left < right && values[right] == values[right + 1]) right--;
                    }
                }
            }
            return triples;
        }
    }
