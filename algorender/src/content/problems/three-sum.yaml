        }
    };
  go: |
    func threeSum(nums []int) [][]int {
    	values := slices.Clone(nums)
    	slices.Sort(values)
    	n := len(values)
    	triples := [][]int{}
    	for i := 0; i < n-2; i++ {
    		if values[i] > 0 {
    			break
    		}
    		if i > 0 && values[i] == values[i-1] {
    			continue
    		}
    		left, right := i+1, n-1
    		for left < right {
    			total := values[i] + values[left] + values[right]
    			if total < 0 {
    				left++
    			} else if total > 0 {
    				right--
    			} else {
    				triples = append(triples, []int{values[i], values[left], values[right]})
    				left++
    				right--
    				for left < right && values[left] == values[left-1] {
    					left++
    				}
    				for left < right && values[right] == values[right+1] {
    					right--
    				}
    			}
    		}
    	}
    	return triples
    }
