title: Mirror a Binary Tree
difficulty: easy
patterns: [trees]
why: >-
  A tree's mirror is its root with the mirrors of its two subtrees swapped. The answer for a node
  comes straight from the answers for its children: recursion.
summary: Swap every node's left and right children.
statement: |
  You are given `root`, the root of a binary tree (or nothing, for an empty tree).

  Turn the tree into its mirror image: at every node, the left and right subtrees trade places.
  Return the root of the mirrored tree.

  Trees are written in level order, row by row from the top, with `null` where a node is missing:
  `[4, 2, 7, 1, 3]` is 4 at the root, 2 and 7 below it, then 1 and 3 under 2.
constraints:
  - "The tree holds 0 to 100 nodes."
  - "Every value is between −100 and 100."
signature:
  function: invertTree
  params:
    - { name: root, type: TreeNode }
  returns: TreeNode
examples:
  - input: { root: [4, 2, 7, 1, 3, 6, 9] }
    output: [4, 7, 2, 9, 6, 3, 1]
  - input: { root: [5, 3] }
    output: [5, null, 3]
    explanation: The only child moves from the left side to the right.
tests:
  - input: { root: [] }
    output: []
  - input: { root: [1] }
    output: [1]
  - input: { root: [1, null, 2, null, 3] }
    output: [1, 2, null, 3]
  - input: { root: [8, 4, 12, 2, 6, null, 14] }
    output: [8, 12, 4, 14, null, 6, 2]
generated: { count: 6, seed: 2 }
hints:
  - "If the left and right subtrees were already mirrored, what would be left to do at the root?"
  - "Mirror both subtrees, then swap them. An empty tree is its own mirror."
approach: |
  Recurse: an empty tree is its own mirror. Otherwise mirror the left subtree and the right
  subtree, then attach the mirrored left as the new right child and the mirrored right as the new
  left child. Each node is visited once.
complexity: { time: "O(n)", space: "O(h) for the recursion, h the tree's height" }
solutions:
  python: |
    def invert_tree(root: TreeNode | None) -> TreeNode | None:
        if root is None:
            return None
        left = invert_tree(root.left)
        right = invert_tree(root.right)
        root.left = right
        root.right = left
        return root
  typescript: |
    function invertTree(root: TreeNode | null): TreeNode | null {
      if (root === null) return null;
      const left = invertTree(root.left);
      const right = invertTree(root.right);
      root.left = right;
      root.right = left;
      return root;
    }
  java: |
    class Solution {
        public TreeNode invertTree(TreeNode root) {
            if (root == null) return null;
            TreeNode left = invertTree(root.left);
            TreeNode right = invertTree(root.right);
            root.left = right;
            root.right = left;
            return root;
        }
    }
  cpp: |
    class Solution {
    public:
        TreeNode* invertTree(TreeNode* root) {
            if (!root) return nullptr;
            TreeNode* left = invertTree(root->left);
            TreeNode* right = invertTree(root->right);
            root->left = right;
            root->right = left;
            return root;
        }
    };
  go: |
    func invertTree(root *TreeNode) *TreeNode {
    	if root == nil {
    		return nil
    	}
    	root.Left, root.Right = invertTree(root.Right), invertTree(root.Left)
    	return root
    }
visualisers: [binary-tree]
