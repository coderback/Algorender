title: Word Dictionary with Wildcards
difficulty: medium
patterns: [trie, backtracking]
why: >-
  The stored words share starts, so a trie holds them. A `.` could be any letter, so there the
  search tries each child in turn and backs up when a branch fails.
summary: Store words and look them up by patterns in which `.` matches any letter.
statement: |
  Write a class `WordDictionary` that stores lowercase words and finds them by pattern:

  - `WordDictionary()` makes an empty dictionary.
  - `addWord(word)` stores `word`.
  - `search(word)` returns `true` if some stored word matches `word`, and `false` otherwise.
    Here `word` may contain dots: each `.` matches any one letter, and every other letter must
    match itself. A match has exactly the same length.

  Each test is a list of calls, starting with the constructor; the expected answer lists what each
  call returns (`null` for the constructor and for `addWord`).
constraints:
  - "Stored words have 1 to 25 lowercase English letters."
  - "Searched words have 1 to 25 characters, each a lowercase letter or `.`, with at most 2 dots."
  - "A test makes at most 10⁴ calls."
design:
  class: WordDictionary
  methods:
    - { name: addWord, params: [{ name: word, type: string }], returns: void }
    - { name: search, params: [{ name: word, type: string }], returns: bool }
examples:
  - calls: [[WordDictionary], [addWord, "cat"], [addWord, "cart"], [search, "c.t"], [search, "c..t"], [search, "ca"]]
    output: [null, null, null, true, true, false]
    explanation: '`c.t` matches "cat" and `c..t` matches "cart", but nothing matches `ca`: a match must have the same length.'
  - calls: [[WordDictionary], [addWord, "dog"], [search, ".o."], [search, "d.gs"], [search, "."]]
    output: [null, null, true, false, false]
tests:
  - calls: [[WordDictionary], [search, "a"], [search, "."]]
    output: [null, false, false]
  - calls: [[WordDictionary], [addWord, "a"], [search, "."], [search, "a"], [search, ".."]]
    output: [null, null, true, true, false]
  - calls: [[WordDictionary], [addWord, "pin"], [addWord, "pan"], [search, "p.n"], [search, "p.t"], [search, ".an"], [search, "..n"], [search, "pe."]]
    output: [null, null, null, true, false, true, true, false]
  - calls: [[WordDictionary], [addWord, "ax"], [addWord, "by"], [search, ".y"], [search, ".z"], [search, "a."]]
    output: [null, null, null, true, false, true]
generated: { count: 8, seed: 52 }
hints:
  - "Without dots this is an ordinary trie lookup. What changes when a character could be any letter?"
  - "At a `.`, the next letter could be any child of the current node, so try each one."
  - "Write the search recursively: given a node and a position in the pattern, match one character and recurse on the rest. At a dot, succeed if the recursion succeeds for any child."
approach: |
  Store the words in a trie: each node maps letters to child nodes and has a flag `end` for a word
  ending there. `addWord` walks down from the root, making missing children, and sets `end` on the
  last node.

  `search` is a depth-first search of the trie, steered by the pattern. `match(node, i)` asks
  whether the pattern from position `i` onwards can be matched starting from `node`:

  - at the end of the pattern, the answer is `node.end`;
  - for a letter, follow that letter's child, or fail if there isn't one;
  - for a `.`, try every child, and succeed as soon as one of them does. A branch that fails just
    returns, and the next child is tried.
complexity: { time: "O(L) to add; O(L) to search without dots, up to O(26ᵈ · L) with d dots", space: "O(total letters stored)" }
solutions:
  python: |
    class TrieNode:
        def __init__(self):
            self.children = {}
            self.end = False  # a stored word ends here


    class WordDictionary:
        def __init__(self):
            self.root = TrieNode()

        def add_word(self, word: str) -> None:
            node = self.root
            for ch in word:
                if ch not in node.children:
                    node.children[ch] = TrieNode()
                node = node.children[ch]
            node.end = True

        def search(self, word: str) -> bool:
            def match(node: TrieNode, i: int) -> bool:
                """Whether word[i:] can be matched starting from node."""
                if i == len(word):
                    return node.end
                if word[i] == '.':
                    for child in node.children.values():
                        if match(child, i + 1):
                            return True
                    return False
                child = node.children.get(word[i])
                return child is not None and match(child, i + 1)

            return match(self.root, 0)
  typescript: |
    class TrieNode {
      children = new Map<string, TrieNode>();
      end = false; // a stored word ends here
    }

    class WordDictionary {
      private root = new TrieNode();

      addWord(word: string): void {
        let node = this.root;
        for (const ch of word) {
          let child = node.children.get(ch);
          if (child === undefined) {
            child = new TrieNode();
            node.children.set(ch, child);
          }
          node = child;
        }
        node.end = true;
      }

      search(word: string): boolean {
        // Whether word from position i on can be matched starting from node.
        const match = (node: TrieNode, i: number): boolean => {
          if (i === word.length) return node.end;
          if (word[i] === '.') {
            for (const child of node.children.values()) {
              if (match(child, i + 1)) return true;
            }
            return false;
          }
          const child = node.children.get(word[i]);
          return child !== undefined && match(child, i + 1);
        };
        return match(this.root, 0);
      }
    }
  java: |
    class WordDictionary {
        private static class TrieNode {
            TrieNode[] children = new TrieNode[26];
            boolean end; // a stored word ends here
        }

        private final TrieNode root = new TrieNode();

        public WordDictionary() {}

        public void addWord(String word) {
            TrieNode node = root;
            for (char ch : word.toCharArray()) {
                if (node.children[ch - 'a'] == null) node.children[ch - 'a'] = new TrieNode();
                node = node.children[ch - 'a'];
            }
            node.end = true;
        }

        public boolean search(String word) {
            return match(word, root, 0);
        }

        // Whether word from position i on can be matched starting from node.
        private boolean match(String word, TrieNode node, int i) {
            if (i == word.length()) return node.end;
            char ch = word.charAt(i);
            if (ch == '.') {
                for (TrieNode child : node.children) {
                    if (child != null && match(word, child, i + 1)) return true;
                }
                return false;
            }
            TrieNode child = node.children[ch - 'a'];
            return child != null && match(word, child, i + 1);
        }
    }
  cpp: |
    class WordDictionary {
        struct TrieNode {
            array<unique_ptr<TrieNode>, 26> children;
            bool end = false; // a stored word ends here
        };

        TrieNode root;

        // Whether word from position i on can be matched starting from node.
        bool match(const string& word, const TrieNode* node, size_t i) const {
            if (i == word.size()) return node->end;
            if (word[i] == '.') {
                for (auto& child : node->children) {
                    if (child && match(word, child.get(), i + 1)) return true;
                }
                return false;
            }
            auto& child = node->children[word[i] - 'a'];
            return child && match(word, child.get(), i + 1);
        }

    public:
        WordDictionary() {}

        void addWord(string& word) {
            TrieNode* node = &root;
            for (char ch : word) {
                auto& child = node->children[ch - 'a'];
                if (!child) child = make_unique<TrieNode>();
                node = child.get();
            }
            node->end = true;
        }

        bool search(string& word) {
            return match(word, &root, 0);
        }
    };
  go: |
    type trieNode struct {
    	children [26]*trieNode
    	end      bool // a stored word ends here
    }

    type WordDictionary struct {
    	root *trieNode
    }

    func Constructor() WordDictionary {
    	return WordDictionary{root: &trieNode{}}
    }

    func (this *WordDictionary) AddWord(word string) {
    	node := this.root
    	for i := 0; i < len(word); i++ {
    		k := word[i] - 'a'
    		if node.children[k] == nil {
    			node.children[k] = &trieNode{}
    		}
    		node = node.children[k]
    	}
    	node.end = true
    }

    func (this *WordDictionary) Search(word string) bool {
    	// match reports whether word[i:] can be matched starting from node.
    	var match func(node *trieNode, i int) bool
    	match = func(node *trieNode, i int) bool {
    		if i == len(word) {
    			return node.end
    		}
    		if word[i] == '.' {
    			for _, child := range node.children {
    				if child != nil && match(child, i+1) {
    					return true
    				}
    			}
    			return false
    		}
    		child := node.children[word[i]-'a']
    		return child != nil && match(child, i+1)
    	}
    	return match(this.root, 0)
    }
