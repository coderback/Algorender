title: Find a Number in a Sorted List
difficulty: easy
patterns: [binary-search]
why: >-
  The list is sorted, so one comparison with the middle number tells you which half the target
  must be in. Halving the range at every step finds it in O(log n).
summary: Return the position of a target in a sorted list of different numbers, or −1.
statement: |
  You are given a list `nums` of different integers, sorted from smallest to largest, and an
  integer `target`. Return the index of `target` in `nums` (counting from 0), or `-1` if it isn't
  there.

  Your solution should take O(log n) time.
constraints:
  - "`nums` holds 1 to 10⁴ numbers, all different, in increasing order."
  - "Every number, and `target`, is between −10⁴ and 10⁴."
signature:
  function: search
  params:
    - { name: nums, type: "int[]" }
    - { name: target, type: int }
  returns: int
examples:
  - input: { nums: [-4, 0, 3, 8, 12, 20], target: 8 }
    output: 3
  - input: { nums: [-4, 0, 3, 8, 12, 20], target: 5 }
    output: -1
    explanation: "5 would sit between 3 and 8, but it isn't there."
tests:
  - input: { nums: [7], target: 7 }
    output: 0
  - input: { nums: [7], target: 2 }
    output: -1
  - input: { nums: [1, 2], target: 2 }
    output: 1
  - input: { nums: [1, 3, 5, 7, 9], target: 1 }
    output: 0
  - input: { nums: [1, 3, 5, 7, 9], target: 10 }
    output: -1
  - input: { nums: [-10000, 10000], target: -10000 }
    output: 0
generated: { count: 8, seed: 36 }
hints:
  - "Compare `target` with the middle number. What does that tell you about the left half and the right half?"
  - "Keep a range `[lo, hi]` where the target must be, if it is anywhere. Each comparison throws away half of it."
  - "Stop when the range is empty: then the target isn't in the list."
approach: |
  Keep `lo = 0` and `hi = n − 1`, the range where `target` could be. While `lo ≤ hi`, look at
  `mid = (lo + hi) // 2`. If `nums[mid]` is the target, return `mid`. If it is smaller, the target
  can only be to its right: set `lo = mid + 1`. Otherwise it can only be to its left: set
  `hi = mid − 1`. If the range runs out, return `-1`.
complexity: { time: "O(log n)", space: "O(1)" }
solutions:
  python: |
    def search(nums: list[int], target: int) -> int:
        lo, hi = 0, len(nums) - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            if nums[mid] == target:
                return mid
            if nums[mid] < target:
                lo = mid + 1
            else:
                hi = mid - 1
        return -1
  typescript: |
    function search(nums: number[], target: number): number {
      let lo = 0;
      let hi = nums.length - 1;
      while (lo <= hi) {
        const mid = Math.floor((lo + hi) / 2);
        if (nums[mid] === target) return mid;
        if (nums[mid] < target) lo = mid + 1;
        else hi = mid - 1;
      }
      return -1;
    }
visualisers: [binary-search]
