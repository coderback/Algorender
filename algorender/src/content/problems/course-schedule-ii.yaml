title: Course Order
difficulty: medium
patterns: [topological-sort, graphs]
why: >-
  Courses with prerequisites form a directed graph, and a valid order takes each course only after
  everything that points into it. That is a topological sort, and a cycle makes one impossible.
summary: Order courses so every prerequisite comes first, or report that none can.
statement: |
  There are `numCourses` courses, numbered from 0. Each pair `[a, b]` in `prerequisites` means
  course `b` must be taken before course `a`.

  Return an order in which to take every course once, with each course after all of its
  prerequisites. If several orders work, return any of them. If the prerequisites go round in a
  loop, so no order works, return an empty list.
constraints:
  - "1 ≤ `numCourses` ≤ 2000"
  - "`prerequisites` holds at most 5000 pairs, each of two different courses, with no pair repeated."
signature:
  function: findOrder
  params:
    - { name: numCourses, type: int }
    - { name: prerequisites, type: "int[][]" }
  returns: "int[]"
check: course-order
view: memory
examples:
  - input: { numCourses: 3, prerequisites: [[1, 0], [2, 1]] }
    output: [0, 1, 2]
    explanation: Course 0 unlocks 1, which unlocks 2.
  - input: { numCourses: 4, prerequisites: [[1, 0], [2, 0], [3, 1], [3, 2]] }
    output: [0, 1, 2, 3]
    explanation: "`[0, 2, 1, 3]` is right too."
  - input: { numCourses: 2, prerequisites: [[0, 1], [1, 0]] }
    output: []
    explanation: Each course waits for the other.
tests:
  - input: { numCourses: 1, prerequisites: [] }
    output: [0]
  - input: { numCourses: 3, prerequisites: [] }
    output: [0, 1, 2]
  - input: { numCourses: 3, prerequisites: [[0, 1], [1, 2], [2, 0]] }
    output: []
  - input: { numCourses: 5, prerequisites: [[4, 3], [3, 2], [1, 0]] }
    output: [0, 2, 1, 3, 4]
generated: { count: 8, seed: 21 }
hints:
  - "Which courses can you take right away?"
  - "Count, for each course, how many prerequisites it still waits for. Courses waiting for none can go next."
  - "Taking a course lowers the count of every course it unlocks. If you run out of free courses before taking them all, there's a loop."
approach: |
  Kahn's algorithm. Count each course's prerequisites (its in-degree) and list which courses each
  one unlocks. Start a queue with every course whose count is 0. Repeatedly take a course from the
  queue, add it to the order, and lower the count of each course it unlocks, queueing any that
  reach 0. If the order ends up with every course, return it; otherwise some courses wait on each
  other in a loop, so return `[]`.
complexity: { time: "O(V + E)", space: "O(V + E)" }
solutions:
  python: |
    from collections import deque

    def find_order(num_courses: int, prerequisites: list[list[int]]) -> list[int]:
        unlocks = [[] for _ in range(num_courses)]
        waiting = [0] * num_courses
        for course, before in prerequisites:
            unlocks[before].append(course)
            waiting[course] += 1
        ready = deque(c for c in range(num_courses) if waiting[c] == 0)
        order = []
        while ready:
            course = ready.popleft()
            order.append(course)
            for nxt in unlocks[course]:
                waiting[nxt] -= 1
                if waiting[nxt] == 0:
                    ready.append(nxt)
        return order if len(order) == num_courses else []
  typescript: |
    function findOrder(numCourses: number, prerequisites: number[][]): number[] {
      const unlocks: number[][] = Array.from({ length: numCourses }, () => []);
      const waiting = new Array<number>(numCourses).fill(0);
      for (const [course, before] of prerequisites) {
        unlocks[before].push(course);
        waiting[course]++;
      }
      const ready: number[] = [];
      for (let c = 0; c < numCourses; c++) if (waiting[c] === 0) ready.push(c);
      const order: number[] = [];
      for (let k = 0; k < ready.length; k++) {
        const course = ready[k];
        order.push(course);
        for (const next of unlocks[course]) {
          if (--waiting[next] === 0) ready.push(next);
        }
      }
      return order.length === numCourses ? order : [];
    }
visualisers: [topological-sort]
