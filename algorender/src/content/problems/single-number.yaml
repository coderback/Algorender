title: Find the Unpaired Number
difficulty: easy
patterns: [bit-manipulation]
why: >-
  Every value comes in a pair except one, and XOR cancels equal values (`x ^ x = 0`) in any order,
  so XOR-ing everything together leaves the odd one out, with no extra memory.
summary: Every number in the list appears twice except one; find that one.
statement: |
  In the list `nums`, every value appears exactly twice, except one value that appears only once.
  Return that value.

  Aim for a single pass that uses only a constant amount of extra memory.
constraints:
  - "`nums` holds 1 to 29999 numbers."
  - "−10⁹ ≤ `nums[i]` ≤ 10⁹"
  - "Every value appears twice, except exactly one that appears once."
signature:
  function: singleNumber
  params:
    - { name: nums, type: "int[]" }
  returns: int
examples:
  - input: { nums: [5, 3, 5] }
    output: 3
  - input: { nums: [8, -2, 7, 8, 7] }
    output: -2
    explanation: "8 and 7 each appear twice; -2 appears once."
tests:
  - input: { nums: [7] }
    output: 7
  - input: { nums: [0, 1, 0] }
    output: 1
  - input: { nums: [1, 1, 0] }
    output: 0
  - input: { nums: [-1, -1, -2] }
    output: -2
  - input: { nums: [1000000000, -1000000000, -1000000000] }
    output: 1000000000
  - input: { nums: [2, 3, 4, 3, 2] }
    output: 4
generated: { count: 6, seed: 36 }
hints:
  - "A set or a map of counts works, but takes O(n) extra memory. Could the pairs cancel each other out instead?"
  - "What is `x ^ x`? What is `x ^ 0`? Does the order you XOR things in matter?"
  - "XOR every number together: each pair cancels to 0, and what is left is the single number."
approach: |
  XOR (`^`) compares numbers bit by bit: a bit of the result is 1 when exactly one of the two bits
  is 1. So `x ^ x = 0`, `x ^ 0 = x`, and XOR doesn't care about order or grouping.

  XOR all the numbers together. Rearranged, every pair becomes `x ^ x = 0`, and the zeros vanish,
  leaving only the value that appears once. Negative numbers work too, since XOR acts on their
  two's-complement bits.
complexity: { time: "O(n)", space: "O(1)" }
solutions:
  python: |
    def single_number(nums: list[int]) -> int:
        result = 0
        for x in nums:
            result ^= x  # pairs cancel: x ^ x == 0
        return result
  typescript: |
    function singleNumber(nums: number[]): number {
      let result = 0;
      for (const x of nums) {
        result ^= x; // pairs cancel: x ^ x === 0
      }
      return result;
    }
