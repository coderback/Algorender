title: Fewest Ranges to Remove
difficulty: medium
patterns: [intervals, greedy]
why: >-
  Keeping the most ranges is the classic scheduling choice: sort by end and always keep the range
  that finishes first, since it leaves the most room for the rest. Whatever you don't keep, you
  remove.
summary: Remove as few ranges as possible so that the rest don't overlap.
statement: |
  You are given a list of ranges `intervals`, each `[start, end]` with `start < end`. Return the
  smallest number of ranges you must remove so that no two of the remaining ranges overlap.

  Here, ranges that only touch at an end point do **not** overlap: `[1, 3]` and `[3, 5]` can both
  stay.
constraints:
  - "`intervals` holds 1 to 10⁵ ranges."
  - "−5 × 10⁴ ≤ `start` < `end` ≤ 5 × 10⁴"
signature:
  function: eraseOverlapIntervals
  params:
    - { name: intervals, type: "int[][]" }
  returns: int
view: memory
examples:
  - input: { intervals: [[1, 4], [2, 3], [3, 6], [5, 7]] }
    output: 2
    explanation: "Remove `[1, 4]` and `[5, 7]`. `[2, 3]` and `[3, 6]` only touch, so both can stay."
  - input: { intervals: [[0, 5], [0, 5], [0, 5]] }
    output: 2
    explanation: Copies of a range overlap each other, so only one can stay.
tests:
  - input: { intervals: [[1, 2]] }
    output: 0
  - input: { intervals: [[1, 2], [2, 3], [3, 4]] }
    output: 0
  - input: { intervals: [[1, 10], [2, 3], [4, 5], [6, 7]] }
    output: 1
  - input: { intervals: [[-5, 5], [-3, -1], [1, 3], [4, 8]] }
    output: 1
  - input: { intervals: [[1, 3], [2, 4], [3, 5], [4, 6]] }
    output: 2
generated: { count: 8, seed: 42 }
hints:
  - "Removing the fewest ranges is the same as keeping the most. Which single range is the safest one to keep first?"
  - "The range that ends earliest: any good selection can swap its first range for that one and still have no overlaps."
  - "Sort by end. Walk through, keeping a range whenever it starts at or after the end of the last range you kept, and count the others."
approach: |
  Removing the fewest ranges means keeping as many as possible that don't overlap. Sort the ranges
  by end. Keep the first; then for each next range, if it starts at or after the end of the last
  kept range (touching is allowed), keep it and remember its end. Otherwise it clashes, so count it
  as removed.

  Why the earliest end is safe: the range that finishes first leaves the most room after it, so
  putting it in place of the first range of any best selection never causes a clash.
complexity: { time: "O(n log n)", space: "O(n) for the sorted copy" }
solutions:
  python: |
    def erase_overlap_intervals(intervals: list[list[int]]) -> int:
        ordered = sorted(intervals, key=lambda r: r[1])
        removed = 0
        last_end = ordered[0][1]
        for start, end in ordered[1:]:
            if start < last_end:
                removed += 1
            else:
                last_end = end
        return removed
  typescript: |
    function eraseOverlapIntervals(intervals: number[][]): number {
      const ordered = [...intervals].sort((a, b) => a[1] - b[1]);
      let removed = 0;
      let lastEnd = ordered[0][1];
      for (const [start, end] of ordered.slice(1)) {
        if (start < lastEnd) removed++;
        else lastEnd = end;
      }
      return removed;
    }
