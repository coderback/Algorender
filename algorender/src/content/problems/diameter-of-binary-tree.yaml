title: Longest Path in a Binary Tree
difficulty: easy
patterns: [trees]
why: >-
  The longest path turns at some highest node and runs down both of its sides, so its length is
  that node's left height plus its right height. One depth-first pass computes every height and
  keeps the best sum along the way.
summary: Count the edges on the longest path between any two nodes of a binary tree.
statement: |
  You are given `root`, the root of a non-empty binary tree.

  Return the length of the longest path between any two nodes, counted in edges (the links between
  a parent and a child). A path never visits a node twice, and it need not pass through the root.

  Trees are written in level order, row by row from the top, with `null` where a node is missing:
  `[4, 2, 7, null, 3]` is 4 at the root, 2 and 7 below it, and 3 as the right child of 2.
constraints:
  - "The tree holds 1 to 1000 nodes."
  - "Every value is between −100 and 100."
signature:
  function: diameterOfBinaryTree
  params:
    - { name: root, type: TreeNode }
  returns: int
examples:
  - input: { root: [8, 3, 10, 1, 6, null, 14] }
    output: 4
    explanation: "One longest path is 1 → 3 → 8 → 10 → 14, which has four edges."
  - input: { root: [1, 2, null, 3, 4, 5, null, null, 6, 7, null, null, 8] }
    output: 6
    explanation: "The longest path, 7 → 5 → 3 → 2 → 4 → 6 → 8, turns at 2 and never reaches the root."
tests:
  - input: { root: [5] }
    output: 0
  - input: { root: [1, 2] }
    output: 1
  - input: { root: [1, 2, 3] }
    output: 2
  - input: { root: [1, 2, null, 3, null, 4, null, 5] }
    output: 4
  - input: { root: [0, 1, 2, 3, 4, null, null, 5, null, null, 6] }
    output: 4
generated: { count: 8, seed: 41 }
hints:
  - "Every path has one highest node, where it turns. How long is the longest path that turns at a given node?"
  - "It goes as far down the left subtree as it can, and as far down the right: the left subtree's height plus the right subtree's height, where height counts nodes on the longest way down."
  - "Write one recursive function that returns a subtree's height and, along the way, updates the best `left + right` seen so far."
approach: |
  Every path has a highest node, where it turns. The longest path turning at a node runs down to
  the deepest node on each side, so its length in edges is `height(left) + height(right)`, where a
  subtree's height counts the nodes on its longest downward path (0 for an empty one).

  A post-order recursion returns each subtree's height, `1 + max(left, right)`, and at every node
  updates the best `left + right` seen so far. That best value is the answer.
complexity: { time: "O(n)", space: "O(h) for the recursion, h the tree's height" }
solutions:
  python: |
    def diameter_of_binary_tree(root: TreeNode | None) -> int:
        best = 0

        def height(node: TreeNode | None) -> int:
            nonlocal best
            if node is None:
                return 0
            left = height(node.left)
            right = height(node.right)
            best = max(best, left + right)  # the longest path turning at this node
            return 1 + max(left, right)

        height(root)
        return best
  typescript: |
    function diameterOfBinaryTree(root: TreeNode | null): number {
      let best = 0;
      const height = (node: TreeNode | null): number => {
        if (node === null) return 0;
        const left = height(node.left);
        const right = height(node.right);
        best = Math.max(best, left + right); // the longest path turning at this node
        return 1 + Math.max(left, right);
      };
      height(root);
      return best;
    }
  java: |
    class Solution {
        private int best;

        public int diameterOfBinaryTree(TreeNode root) {
            best = 0;
            height(root);
            return best;
        }

        private int height(TreeNode node) {
            if (node == null) return 0;
            int left = height(node.left);
            int right = height(node.right);
            best = Math.max(best, left + right); // the longest path turning at this node
            return 1 + Math.max(left, right);
        }
    }
  cpp: |
    class Solution {
    public:
        int diameterOfBinaryTree(TreeNode* root) {
            best = 0;
            height(root);
            return best;
        }

    private:
        int best = 0;

        int height(TreeNode* node) {
            if (!node) return 0;
            int left = height(node->left);
            int right = height(node->right);
            best = max(best, left + right); // the longest path turning at this node
            return 1 + max(left, right);
        }
    };
  go: |
    func diameterOfBinaryTree(root *TreeNode) int {
    	best := 0
    	var height func(node *TreeNode) int
    	height = func(node *TreeNode) int {
    		if node == nil {
    			return 0
    		}
    		left, right := height(node.Left), height(node.Right)
    		best = max(best, left+right) // the longest path turning at this node
    		return 1 + max(left, right)
    	}
    	height(root)
    	return best
    }
