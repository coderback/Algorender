title: Days Until a Warmer Day
difficulty: medium
patterns: [monotonic-stack]
why: >-
  For every day you want the next later day that beats it: a "next greater item" question. The
  days still waiting for an answer form a stack of falling temperatures, and each new day pops
  every waiting day it beats.
summary: For each day, count how many days pass until a warmer one.
statement: |
  You are given `temperatures`, the temperature on each of a run of days, in order.

  Return a list `answer` of the same length, where `answer[i]` is how many days after day `i` the
  first strictly warmer day comes. If no later day is warmer, `answer[i]` is 0.
constraints:
  - "`temperatures` holds 1 to 10⁵ values."
  - "Every temperature is between 30 and 100."
signature:
  function: dailyTemperatures
  params:
    - { name: temperatures, type: "int[]" }
  returns: "int[]"
examples:
  - input: { temperatures: [70, 68, 72, 71, 69, 75] }
    output: [2, 1, 3, 2, 1, 0]
    explanation: "Day 0 (70) waits until day 2 (72); day 2 (72) waits until day 5 (75); nothing comes after day 5."
  - input: { temperatures: [50, 50, 50] }
    output: [0, 0, 0]
    explanation: Only a strictly warmer day counts, so equal days never answer each other.
tests:
  - input: { temperatures: [80] }
    output: [0]
  - input: { temperatures: [30, 40, 50, 60] }
    output: [1, 1, 1, 0]
  - input: { temperatures: [90, 80, 70, 60] }
    output: [0, 0, 0, 0]
  - input: { temperatures: [55, 38, 60, 38, 60, 61] }
    output: [2, 1, 3, 1, 1, 0]
  - input: { temperatures: [40, 35, 36, 37, 38, 100] }
    output: [5, 1, 1, 1, 1, 0]
generated: { count: 8, seed: 32 }
hints:
  - "Checking every later day for every day takes about n² steps. As you scan, which days are still waiting for their answer?"
  - "The waiting days always have falling temperatures: a warmer day would already have answered the cooler days before it. Keep their indices on a stack."
  - "When a new day arrives, pop every waiting day that is cooler and record the gap between the two indices. Then push the new day."
approach: |
  Scan the days with a stack of the indices still waiting for a warmer day. Their temperatures
  never rise from the bottom of the stack to the top, because a warmer day would already have
  answered every cooler day below it.

  For each new day, pop every waiting day that is cooler than it, and set that day's answer to the
  difference between the two indices. Then push the new day. Days still on the stack at the end
  keep the answer 0. Each day is pushed once and popped at most once, so the scan is linear.
complexity: { time: "O(n)", space: "O(n)" }
solutions:
  python: |
    def daily_temperatures(temperatures: list[int]) -> list[int]:
        answer = [0] * len(temperatures)
        waiting = []  # indices of days with no warmer day yet, temperatures falling
        for day in range(len(temperatures)):
            while waiting and temperatures[waiting[-1]] < temperatures[day]:
                earlier = waiting.pop()
                answer[earlier] = day - earlier
            waiting.append(day)
        return answer
  typescript: |
    function dailyTemperatures(temperatures: number[]): number[] {
      const answer = new Array<number>(temperatures.length).fill(0);
      const waiting: number[] = []; // indices of days with no warmer day yet, temperatures falling
      for (let day = 0; day < temperatures.length; day++) {
        while (waiting.length > 0 && temperatures[waiting[waiting.length - 1]] < temperatures[day]) {
          const earlier = waiting.pop()!;
          answer[earlier] = day - earlier;
        }
        waiting.push(day);
      }
      return answer;
    }
visualisers: [monotonic-stack]
