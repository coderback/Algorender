            vector<bool> zeroRow(rows, false); // rows that held a zero at the start
            vector<bool> zeroCol(cols, false); // columns that held a zero at the start
            for (int r = 0; r < rows; r++) {
                for (int c = 0; c < cols; c++) {
                    if (matrix[r][c] == 0) {
                        zeroRow[r] = true;
