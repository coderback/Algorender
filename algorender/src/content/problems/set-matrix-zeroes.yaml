    func setZeroes(matrix [][]int) {
    	rows, cols := len(matrix), len(matrix[0])
    	zeroRow := make([]bool, rows) // rows that held a zero at the start
    	zeroCol := make([]bool, cols) // columns that held a zero at the start
    	for r := 0; r < rows; r++ {
    		for c := 0; c < cols; c++ {
    			if matrix[r][c] == 0 {
