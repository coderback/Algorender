title: Rob Houses in a Circle
difficulty: medium
patterns: [dp-1d]
why: >-
  Once you decide which end of the ring to leave alone, the circle becomes a straight row, and a
  straight row is solved by the one-dimensional rob-or-skip table.
summary: Rob houses arranged in a ring, never two neighbours, where the first and last houses are neighbours.
statement: |
  Houses stand in a circle, and `nums[i]` is the money in house `i`. House `i` is next to houses
  `i − 1` and `i + 1`, and the last house is next to the first. Robbing two neighbouring houses
  sets off an alarm.

  Return the largest total you can take without robbing two neighbours. When there is only one
  house, you can rob it.
constraints:
  - "`nums` holds 1 to 2000 numbers."
  - "0 ≤ `nums[i]` ≤ 1000"
signature:
  function: robCircle
  params:
    - { name: nums, type: "int[]" }
  returns: int
examples:
  - input: { nums: [2, 3, 2] }
    output: 3
    explanation: "Houses 0 and 2 are neighbours in the circle, so the best is house 1 on its own."
  - input: { nums: [1, 2, 3, 1] }
    output: 4
    explanation: "Rob houses 0 and 2: 1 + 3 = 4."
tests:
  - input: { nums: [9] }
    output: 9
  - input: { nums: [4, 7] }
    output: 7
  - input: { nums: [1, 1, 1] }
    output: 1
  - input: { nums: [3, 1, 1, 3] }
    output: 4
  - input: { nums: [0, 0] }
    output: 0
  - input: { nums: [2, 7, 9, 3, 1] }
    output: 11
generated: { count: 8, seed: 23 }
hints:
  - "The only new trouble is that the first and last houses are neighbours. Can you split the problem into cases where that never matters?"
  - "In any safe choice, the first house or the last house (or both) is left alone. Either way, what remains is a straight row."
  - "Solve the straight row twice, once without the last house and once without the first, and take the larger answer. A single house needs care."
approach: |
  No safe choice robs both the first and the last house, so the best total is the better of two
  straight-row problems: houses 0 to n − 2 (the last house left alone) and houses 1 to n − 1 (the
  first house left alone).

  Solve each row with the rob-or-skip walk: keep `best`, the most from the houses seen so far, and
  `before`, the most from all but the last of them; at each house the new best is the larger of
  `best` and `before + money`.

  A single house is the exception: both rows would be empty, so return its money directly.
complexity: { time: "O(n)", space: "O(1)" }
solutions:
  python: |
    def rob_circle(nums: list[int]) -> int:
        def rob_row(lo: int, hi: int) -> int:
            # the best total from houses lo to hi - 1, standing in a straight row
            before, best = 0, 0
            for i in range(lo, hi):
                before, best = best, max(best, before + nums[i])
            return best

        n = len(nums)
        if n == 1:
            return nums[0]
        return max(rob_row(0, n - 1), rob_row(1, n))
  typescript: |
    function robCircle(nums: number[]): number {
      // The best total from houses lo to hi - 1, standing in a straight row.
      const robRow = (lo: number, hi: number): number => {
        let before = 0;
        let best = 0;
        for (let i = lo; i < hi; i++) {
          [before, best] = [best, Math.max(best, before + nums[i])];
        }
        return best;
      };
      const n = nums.length;
      if (n === 1) return nums[0];
      return Math.max(robRow(0, n - 1), robRow(1, n));
    }
  java: |
    class Solution {
        public int robCircle(int[] nums) {
            int n = nums.length;
            if (n == 1) return nums[0];
            // The first and last houses are neighbours, so leave out one or the other.
            return Math.max(robRow(nums, 0, n - 1), robRow(nums, 1, n));
        }

        // The best total from houses lo to hi - 1, standing in a straight row.
        private int robRow(int[] nums, int lo, int hi) {
            int before = 0;
            int best = 0;
            for (int i = lo; i < hi; i++) {
                int next = Math.max(best, before + nums[i]);
                before = best;
                best = next;
            }
            return best;
        }
    }
  cpp: |
    class Solution {
    public:
        int robCircle(vector<int>& nums) {
            int n = nums.size();
            if (n == 1) return nums[0];
            // The first and last houses are neighbours, so leave out one or the other.
            return max(robRow(nums, 0, n - 1), robRow(nums, 1, n));
        }

    private:
        // The best total from houses lo to hi - 1, standing in a straight row.
        int robRow(const vector<int>& nums, int lo, int hi) {
            int before = 0;
            int best = 0;
            for (int i = lo; i < hi; i++) {
                int next = max(best, before + nums[i]);
                before = best;
                best = next;
            }
            return best;
        }
    };
  go: |
    func robCircle(nums []int) int {
    	// robRow returns the best total from a straight row of houses.
    	robRow := func(row []int) int {
    		before, best := 0, 0
    		for _, money := range row {
    			before, best = best, max(best, before+money)
    		}
    		return best
    	}
    	n := len(nums)
    	if n == 1 {
    		return nums[0]
    	}
    	// The first and last houses are neighbours, so leave out one or the other.
    	return max(robRow(nums[:n-1]), robRow(nums[1:]))
    }
