title: Longest Run of Consecutive Values
difficulty: medium
patterns: [hashing]
why: >-
  Asking "is x + 1 here?" again and again is a membership test, and a hash set answers it in
  constant time, so you can grow each run from its first value without sorting.
summary: Find the length of the longest stretch of consecutive integers hidden in an unsorted list.
statement: |
  You are given an unsorted list of integers `nums`. Return the length of the longest run of
  consecutive integers (such as 4, 5, 6, 7) whose values all appear somewhere in `nums`. The values
  can sit at any positions, and a value that appears more than once counts once.

  Aim for O(n) time, which rules out sorting.
constraints:
  - "`nums` holds 0 to 10⁵ numbers."
  - "Every number is between −10⁹ and 10⁹."
signature:
  function: longestConsecutive
  params:
    - { name: nums, type: "int[]" }
  returns: int
examples:
  - input: { nums: [10, 4, 20, 1, 3, 2] }
    output: 4
    explanation: "1, 2, 3 and 4 are all in the list."
  - input: { nums: [5, 6, 6, 100, 7, -1, 0] }
    output: 3
    explanation: "The run 5, 6, 7 is the longest; the repeated 6 counts once."
tests:
  - input: { nums: [] }
    output: 0
  - input: { nums: [42] }
    output: 1
  - input: { nums: [3, 3, 3] }
    output: 1
  - input: { nums: [-2, -3, -1, 0, 1] }
    output: 5
  - input: { nums: [1, 3, 5, 7] }
    output: 1
  - input: { nums: [9, 1, 4, 7, 3, -1, 0, 5, 8, -1, 6] }
    output: 7
  - input: { nums: [1000000000, -1000000000] }
    output: 1
generated: { count: 8, seed: 25 }
hints:
  - "Sorting would make runs easy to see, but costs O(n log n). What lets you ask \"is this value present?\" in O(1)?"
  - "Put every value in a hash set. A run starts at `x` exactly when `x − 1` is not in the set."
  - "From each start, count up through `x + 1`, `x + 2`, … while they are in the set. Each value is counted in only one run, so the total work is O(n)."
approach: |
  Put all the values in a hash set, which also drops repeats. For each value `x` in the set, skip
  it unless `x − 1` is missing: only then is `x` the first value of a run. From a first value, step
  up through `x + 1`, `x + 2`, … while each is in the set, and keep the longest length seen.

  Each value is looked at once as a possible start, and at most once while a run is counted, so
  the whole thing is O(n).
complexity: { time: "O(n)", space: "O(n)" }
solutions:
  python: |
    def longest_consecutive(nums: list[int]) -> int:
        values = set(nums)
        best = 0
        for x in values:
            if x - 1 not in values:
                length = 1
                while x + length in values:
                    length += 1
                best = max(best, length)
        return best
  typescript: |
    function longestConsecutive(nums: number[]): number {
      const values = new Set(nums);
      let best = 0;
      for (const x of values) {
        if (values.has(x - 1)) continue;
        let length = 1;
        while (values.has(x + length)) length++;
        best = Math.max(best, length);
      }
      return best;
    }
  java: |
    class Solution {
        public int longestConsecutive(int[] nums) {
            Set<Integer> values = new HashSet<>();
            for (int x : nums) values.add(x);
            int best = 0;
            for (int x : values) {
                if (values.contains(x - 1)) continue; // only count from the start of a run
                int length = 1;
                while (values.contains(x + length)) length++;
                best = Math.max(best, length);
            }
            return best;
        }
    }
  cpp: |
    class Solution {
    public:
        int longestConsecutive(vector<int>& nums) {
            unordered_set<int> values(nums.begin(), nums.end());
            int best = 0;
            for (int x : values) {
                if (values.count(x - 1)) continue; // only count from the start of a run
                int length = 1;
                while (values.count(x + length)) length++;
                best = max(best, length);
            }
            return best;
        }
    };
  go: |
    func longestConsecutive(nums []int) int {
    	values := make(map[int]bool, len(nums))
    	for _, x := range nums {
    		values[x] = true
    	}
    	best := 0
    	for x := range values {
    		if values[x-1] {
    			continue // only count from the start of a run
    		}
    		length := 1
    		for values[x+length] {
    			length++
    		}
    		best = max(best, length)
    	}
    	return best
    }
visualisers: [hash-set]
